<style id="app-css">
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
:root{
--night:#1B2B2E;--night2:#132022;--pine:#25473A;--amber:#C0762A;--amberLt:#F3E4CD;
--water:#3E6B7A;--bark:#7C5433;--moss:#5E7A5A;
--cream:#FCF9F3;--zebra:#F2EDE3;--line:#D8CFBF;--ink:#1E2723;--muted:#6C7570;
--bg:var(--cream);--card:#FFFFFF;--head:rgba(251,247,240,.84);
--shadow:0 1px 2px rgba(30,42,50,.05),0 10px 30px rgba(30,42,50,.07);
--shadowUp:0 2px 4px rgba(30,42,50,.07),0 18px 44px rgba(30,42,50,.11);
--serif:Georgia,"Times New Roman",serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--ease:cubic-bezier(.2,.8,.2,1);
--r:16px;
}
html[data-theme="dark"]{
--bg:#121C1D;--card:#1B2729;--zebra:#182324;--line:#314244;--ink:#EAE5D9;--muted:#96A2A0;
--water:#6FA0B0;--bark:#B08557;--moss:#8AA486;
--amberLt:#3A2E20;--cream:#141D23;--head:rgba(20,29,35,.84);
--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.32);
--shadowUp:0 2px 6px rgba(0,0,0,.34),0 18px 44px rgba(0,0,0,.4);
}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.45;
letter-spacing:.002em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{letter-spacing:.005em}
.money,.cdN,.ringPct,.totRow b,.tile b,.grpCnt{font-feature-settings:"tnum" 1;letter-spacing:.01em}
@media (max-width:420px){
  body{font-size:15px}
  .pageH h2{font-size:24px}
  .heroTxt h1{font-size:30px}
  .tile b{font-size:22px}
}
body,input,select,button,textarea{font-variant-numeric:tabular-nums}
input,select,button,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:400}
a{color:var(--amber);text-decoration:none}
a:hover{color:var(--ink)}
::selection{background:var(--amberLt)}

/* ── shell ─────────────────────────────── */
.shell{min-height:100vh;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:40;background:var(--head);
-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
border-bottom:1px solid color-mix(in oklab,var(--line) 42%,transparent)}
.hdrIn{display:flex;align-items:center;gap:6px;padding:8px 12px;min-height:58px;max-width:880px;margin:0 auto}
.hdrTitle{font-family:var(--serif);font-size:20px;letter-spacing:.2px;flex:1;min-width:0;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;
cursor:pointer;flex:0 0 auto;transition:background .15s var(--ease)}
.ib:hover{background:color-mix(in oklab,var(--line) 28%,transparent)}
.ib:active{background:color-mix(in oklab,var(--line) 46%,transparent)}
.ib svg{width:21px;height:21px;stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.saveBtn{display:flex;align-items:center;gap:7px;height:40px;padding:0 15px;border:0;border-radius:11px;
background:var(--amber);color:#fff;font-size:14.5px;font-weight:500;cursor:pointer;flex:0 0 auto;
white-space:nowrap;box-shadow:0 1px 2px rgba(30,42,50,.16),0 6px 16px rgba(200,122,34,.24);
transition:transform .14s var(--ease),box-shadow .2s var(--ease),opacity .15s}
.saveBtn:hover{box-shadow:0 1px 2px rgba(30,42,50,.16),0 10px 22px rgba(200,122,34,.32)}
.saveBtn:active{transform:scale(.96)}
.saveBtn svg{width:17px;height:17px;stroke:#fff;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.saveBtn.busy{opacity:.5}
.warnBar{background:var(--amberLt);color:#8A5311;font-size:12.5px;padding:7px 16px;text-align:center;
border-bottom:1px solid color-mix(in oklab,var(--amber) 28%,transparent)}
html[data-theme="dark"] .warnBar{color:#E8C08A}
@media (max-width:600px){
  #syncTxt{display:none}
  .saveBtn span{display:none}
  .saveBtn{padding:0 12px}
  .hdrIn{gap:4px}
}
.searchWrap{display:none;padding:0 12px 10px;max-width:880px;margin:0 auto}
.searchWrap.on{display:block}
.searchWrap input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);
background:var(--card);padding:0 14px}
.searchWrap input:focus{outline:none;border-color:var(--amber)}

main{flex:1;max-width:880px;width:100%;margin:0 auto;padding:18px 16px 140px}
.view{animation:slidein .28s var(--ease) both}
@keyframes slidein{from{opacity:0;transform:translateX(var(--dir,14px))}to{opacity:1;transform:none}}

/* ── nav ───────────────────────────────── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--head);
-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
border-top:1px solid color-mix(in oklab,var(--line) 42%,transparent);
padding-bottom:env(safe-area-inset-bottom);
transition:transform .28s var(--ease);will-change:transform}
.nav.hid{transform:translateY(105%)}
@media (min-width:920px){.nav.hid{transform:none}}
.navIn{position:relative;display:flex;max-width:880px;margin:0 auto}
.navIn>button{flex:1;min-height:58px;border:0;background:transparent;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:7px 0 9px;color:var(--muted);
transition:color .2s var(--ease)}
.navIn>button svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;
transition:transform .25s var(--ease)}
.navIn>button span{font-size:10.5px;letter-spacing:.1px}
.navIn>button.on{color:var(--amber)}
.navIn>button.on svg{transform:translateY(-1px) scale(1.06)}
.navBar{position:absolute;top:0;left:0;height:2px;background:var(--amber);border-radius:2px;
transition:transform .3s var(--ease),width .3s var(--ease)}

/* ── общие блоки ───────────────────────── */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.sec{margin-bottom:26px}
.secTtl{font-family:var(--serif);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
color:var(--muted);margin:0 2px 11px;display:flex;align-items:center;gap:10px}
.secTtl b{font-weight:400;color:var(--ink)}
.secTtl i{flex:1;height:1px;background:color-mix(in oklab,var(--line) 55%,transparent)}
.hint{color:var(--muted);font-size:12.5px;margin:11px 2px 0;text-wrap:pretty}

/* ── ГЛАВНАЯ ───────────────────────────── */
.heroPic{position:relative;border-radius:var(--r);overflow:hidden;background-size:cover;background-position:50% 62%;
min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;box-shadow:var(--shadowUp)}
.heroPic::after{content:"";position:absolute;inset:0;
background:linear-gradient(to top,rgba(12,18,22,.9) 0%,rgba(12,18,22,.44) 44%,rgba(12,18,22,.06) 100%)}
.heroTxt{position:relative;z-index:1;color:#F7F1E6}
.heroTxt h1{font-size:36px;letter-spacing:.045em;line-height:1.04;animation:up14 .6s var(--ease) both}
.heroSub{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#E5C99E;margin-top:9px;
animation:up14 .6s .06s var(--ease) both}
.heroDates{font-family:var(--serif);font-size:15px;margin-top:3px;color:#DDD4C5;animation:up14 .6s .12s var(--ease) both}
@keyframes up14{from{opacity:0;transform:translateY(14px)}}
.cd{position:relative;z-index:1;display:flex;align-items:baseline;gap:9px;margin-top:18px;
padding-top:15px;border-top:1px solid rgba(247,241,230,.2);color:#F7F1E6;animation:up14 .6s .18s var(--ease) both}
.cdN{font-family:var(--serif);font-size:32px;line-height:1}
.cdL{font-size:12.5px;color:#CFC6B7;flex:1}

.ringRow{display:flex;align-items:center;gap:20px;padding:20px}
.ring{position:relative;width:96px;height:96px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .bg{stroke:color-mix(in oklab,var(--line) 58%,transparent)}
.ring .fg{stroke:var(--amber);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.ringPct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:23px}
.ringTxt strong{display:block;font-family:var(--serif);font-weight:400;font-size:18px;margin-bottom:4px}
.ringTxt span{font-size:13px;color:var(--muted);text-wrap:pretty}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:15px;border:0;
text-align:left;cursor:pointer;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;
gap:8px;transition:transform .16s var(--ease),box-shadow .2s var(--ease)}
.tile:hover{box-shadow:var(--shadowUp)}
.tile:active{transform:scale(.98)}
.tile em{font-style:normal;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-wrap:pretty}
.tile b{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:.01em}
.tile.acc{background:var(--amberLt)}
html[data-theme="dark"] .tile.acc b{color:#F0C68C}

.wRow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wCell{background:var(--card);border-radius:13px;box-shadow:var(--shadow);padding:11px 4px;
text-align:center;min-width:0;transition:transform .2s var(--ease)}
.wCell:hover{transform:translateY(-2px)}
.wCell i{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.wCell svg{width:21px;height:21px;margin:6px auto 4px;display:block;stroke:var(--amber);stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wCell b{font-family:var(--serif);font-weight:400;font-size:16px;display:block}
.wCell u{display:block;text-decoration:none;font-size:11px;color:var(--muted)}

.crew{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.crewC{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
padding:16px 12px 14px;text-align:center;min-width:0;transition:transform .18s var(--ease),box-shadow .22s var(--ease)}
.crewC:hover{box-shadow:var(--shadowUp)}
.avaWrap{position:relative;width:88px;height:88px;margin:0 auto 11px;cursor:pointer}
.avaWrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ava{position:absolute;inset:6px;border-radius:50%;display:grid;place-items:center;overflow:hidden;
font-family:var(--serif);font-size:27px;color:#fff;background-size:cover;background-position:50% 50%;
box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.avaCam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;
background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;pointer-events:none;
opacity:0;transform:scale(.8);transition:opacity .2s var(--ease),transform .2s var(--ease)}
.avaWrap:hover .avaCam,.crewC.noph .avaCam{opacity:1;transform:none}
.avaCam svg{position:static;transform:none;width:15px;height:15px;stroke:var(--muted);stroke-width:1.6;fill:none}
.crewName{font-family:var(--serif);font-size:17px;padding:2px 7px;border-radius:7px;display:inline-block;min-width:44px;white-space:nowrap}
.crewName:focus{outline:1.5px solid var(--amber);outline-offset:1px}
.crewRole{font-size:11.5px;color:var(--muted);margin-top:3px;text-wrap:pretty}
.crewStat{margin-top:9px;font-size:12px;color:var(--muted)}
.crewBar{height:3px;border-radius:3px;background:color-mix(in oklab,var(--line) 55%,transparent);margin-top:7px;overflow:hidden}
.crewBar i{display:block;height:100%;border-radius:3px;transition:width .4s var(--ease)}
.crewX{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;background:transparent;border-radius:50%;
cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .2s var(--ease)}
.crewC:hover .crewX{opacity:.65}
.crewX:hover{opacity:1!important;background:color-mix(in oklab,var(--line) 35%,transparent)}
.crewX svg{width:14px;height:14px;stroke:var(--muted);stroke-width:1.8;fill:none;stroke-linecap:round}
.crewAdd{border:1.5px dashed color-mix(in oklab,var(--line) 85%,transparent);background:transparent;
border-radius:var(--r);min-height:264px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:8px;color:var(--muted);font-size:13.5px;transition:border-color .2s,color .2s}
.crewAdd:hover{border-color:var(--amber);color:var(--amber)}
.crewAdd svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round}

/* ── легенда ───────────────────────────── */
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:14px}
.lg{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);min-width:0;white-space:nowrap}
.lgD{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.lgD svg{width:14px;height:14px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lgD.s1{border-color:var(--amber)} .lgD.s1 svg{stroke:var(--amber)}
.lgD.s2{border-color:var(--pine);background:var(--pine)} .lgD.s2 svg{stroke:#fff}
.lgD.s3{border-color:var(--night);background:var(--night)} .lgD.s3 svg{stroke:#fff}
html[data-theme="dark"] .lgD.s3{border-color:#7FA6BE;background:#7FA6BE}
html[data-theme="dark"] .lgD.s3 svg{stroke:#16222A}

/* ── группы и строки ───────────────────── */
.grp{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.grpH{display:flex;align-items:center;gap:11px;padding:14px;cursor:pointer;user-select:none;
background:transparent;border:0;width:100%;text-align:left;min-height:58px;transition:background .15s}
.grpH:hover{background:color-mix(in oklab,var(--zebra) 60%,transparent)}
.grpCnt{font-family:var(--serif);font-size:14.5px;color:var(--muted);flex:0 0 auto;min-width:54px}
.grpName{flex:1;font-size:15px;font-weight:500;letter-spacing:.01em;min-width:0}
.grpBar{height:3px;border-radius:3px;background:color-mix(in oklab,var(--line) 55%,transparent);
width:56px;flex:0 0 auto;overflow:hidden}
.grpBar i{display:block;height:100%;background:var(--pine);border-radius:3px;transition:width .35s var(--ease)}
.chev{width:18px;height:18px;stroke:var(--muted);stroke-width:1.6;fill:none;stroke-linecap:round;
transition:transform .3s var(--ease);flex:0 0 auto}
.grp.closed .chev{transform:rotate(-90deg)}
.grpBody{border-top:1px solid color-mix(in oklab,var(--line) 38%,transparent);
overflow:hidden;transition:max-height .34s var(--ease),opacity .26s var(--ease)}
.grp.closed .grpBody{max-height:0!important;opacity:0;border-top-color:transparent}

.row{position:relative;overflow:hidden;border-bottom:1px solid color-mix(in oklab,var(--line) 30%,transparent);
animation:rowin .32s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}}
.row:last-of-type{border-bottom:0}
.rowDel{position:absolute;inset:0 0 0 auto;width:112px;background:#A8442E;color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13.5px}
.rowIn{position:relative;background:var(--card);padding:11px 12px;transition:transform .26s var(--ease)}
.row.sw .rowIn{transition:none}
.rowTop{display:flex;align-items:flex-start;gap:11px}
.rowName{flex:1;min-width:0;font-size:15px;padding:3px 3px;border-radius:7px;line-height:1.32;
transition:opacity .25s var(--ease);word-break:break-word;text-wrap:pretty}
.rowName:hover{background:color-mix(in oklab,var(--zebra) 55%,transparent)}
.rowName:focus{outline:1.5px solid var(--amber);outline-offset:1px;background:var(--bg)}
.rowNote{font-size:12.5px;color:var(--muted);margin-top:2px;text-wrap:pretty}
.rowBot{display:flex;align-items:center;gap:7px;padding-left:40px;margin-top:7px;flex-wrap:wrap}
.done .rowName{opacity:.5}
.strike{position:relative}
.strike::after{content:"";position:absolute;left:0;top:53%;height:1px;background:currentColor;
width:0;transition:width .28s var(--ease)}
.done .strike::after{width:100%}
.stLbl{font-size:11.5px;letter-spacing:.03em;margin-top:3px;display:block;color:var(--muted)}
.stLbl[data-s="1"]{color:var(--amber)}
.stLbl[data-s="2"]{color:var(--pine)}
html[data-theme="dark"] .stLbl[data-s="2"]{color:#8FC0A6}
.stLbl[data-s="3"]{color:var(--night)}
html[data-theme="dark"] .stLbl[data-s="3"]{color:#8FB6CE}

.chk{position:relative;width:30px;height:30px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line);
background:transparent;padding:0;cursor:pointer;display:grid;place-items:center;margin:0;
transition:background .25s var(--ease),border-color .25s var(--ease),transform .14s var(--ease)}
.chk:hover{border-color:var(--amber)}
.chk.pop{animation:pop .16s var(--ease)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.chk svg{width:17px;height:17px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chk svg path,.chk svg polyline{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .26s var(--ease)}
.chk.mark svg path,.chk.mark svg polyline{stroke-dashoffset:0}
.chk[data-s="1"]{border-color:var(--amber)} .chk[data-s="1"] svg{stroke:var(--amber)}
.chk[data-s="1"]{border-color:#8A6FA8} .chk[data-s="1"] svg{stroke:#8A6FA8}
.chk[data-s="2"]{border-color:var(--amber)} .chk[data-s="2"] svg{stroke:var(--amber)}
.chk[data-s="3"]{border-color:var(--pine);background:var(--pine)} .chk[data-s="3"] svg{stroke:#fff}
.chk[data-s="4"]{border-color:var(--water);background:var(--water)} .chk[data-s="4"] svg{stroke:#fff}
html[data-theme="dark"] .chk[data-s="4"]{border-color:var(--water);background:var(--water)}
html[data-theme="dark"] .chk[data-s="4"] svg{stroke:#16222A}

.stp{display:flex;align-items:center;background:var(--bg);border-radius:10px;overflow:hidden;flex:0 0 auto;
border:1px solid color-mix(in oklab,var(--line) 52%,transparent)}
.stp button{width:40px;height:38px;border:0;background:transparent;cursor:pointer;color:var(--muted);
display:grid;place-items:center;transition:background .15s}
.stp button:hover{background:color-mix(in oklab,var(--line) 30%,transparent)}
.stp button svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.stp input{width:42px;height:38px;border:0;background:transparent;text-align:center;font-size:14px}
.stp input:focus{outline:none;background:var(--amberLt)}
.stpU{font-size:12px;color:var(--muted);padding-right:10px}

.pchip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 11px 0 9px;border-radius:10px;
border:1px solid color-mix(in oklab,var(--line) 58%,transparent);background:transparent;cursor:pointer;
font-size:13px;color:var(--muted);transition:background .2s var(--ease),border-color .2s var(--ease),transform .14s var(--ease)}
.pchip:hover{border-color:var(--amber)}
.pchip.pop{animation:pop .16s var(--ease)}
.pchip .av{width:22px;height:22px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
background-size:cover;background-position:50% 50%;font-family:var(--serif);font-size:11px;color:#fff}
.pchip b{font-weight:500;color:var(--ink);font-family:var(--serif);font-size:14px}
.pchip .gl{width:15px;height:15px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke:var(--line)}
.pchip[data-s="1"]{border-color:#8A6FA8;background:color-mix(in oklab,#8A6FA8 9%,transparent)}
.pchip[data-s="1"] .gl{stroke:#8A6FA8}
.pchip[data-s="2"]{border-color:var(--amber);background:color-mix(in oklab,var(--amber) 9%,transparent)}
.pchip[data-s="2"] .gl{stroke:var(--amber)}
.pchip[data-s="3"]{border-color:transparent;background:color-mix(in oklab,var(--pine) 17%,transparent)}
.pchip[data-s="3"] .gl{stroke:var(--pine)}
.pchip[data-s="3"] b{color:var(--pine)}
html[data-theme="dark"] .pchip[data-s="3"] b,html[data-theme="dark"] .pchip[data-s="3"] .gl{color:#8FC0A6;stroke:#8FC0A6}
.pchip[data-s="4"]{border-color:transparent;background:color-mix(in oklab,var(--water) 16%,transparent)}
.pchip[data-s="4"] .gl{stroke:var(--water)}
.pchip[data-s="4"] b{color:var(--water)}
.pchip.sel{border-color:var(--amber);background:color-mix(in oklab,var(--amber) 12%,transparent)}
.pchip.base{font-size:12.5px}
.newDot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);
vertical-align:middle;margin-left:6px}
.trashB{width:38px;height:38px;border:0;background:transparent;border-radius:10px;cursor:pointer;
display:grid;place-items:center;flex:0 0 auto;margin-left:auto;opacity:.5;transition:opacity .2s,background .2s}
.trashB:hover{opacity:1;background:color-mix(in oklab,#A8442E 12%,transparent)}
.trashB svg{width:16px;height:16px;stroke:#A8442E;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.totMini{font-family:var(--serif);color:var(--muted);font-size:13px;padding:0 4px;white-space:nowrap}

/* добавление */
.addRow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;
padding:14px;min-height:54px;cursor:pointer;color:var(--muted);font-size:14.5px;text-align:left;
border-top:1px solid color-mix(in oklab,var(--line) 30%,transparent);transition:color .18s,background .18s}
.addRow:hover{color:var(--amber);background:color-mix(in oklab,var(--zebra) 55%,transparent)}
.addRow svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;flex:0 0 auto}
.addForm{border-top:1px solid color-mix(in oklab,var(--line) 30%,transparent);padding:12px 14px 14px;
background:color-mix(in oklab,var(--amberLt) 40%,transparent);animation:rowin .26s var(--ease) both}
.addForm input.nm{width:100%;height:42px;border:0;border-bottom:1.5px solid var(--amber);background:transparent;
font-size:15.5px;padding:0 2px}
.addForm input.nm:focus{outline:none}
.addForm .lbl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:13px 0 7px}
.addForm .rowA{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.addForm .go{height:40px;padding:0 16px;border-radius:10px;border:0;background:var(--amber);color:#fff;
font-size:14.5px;cursor:pointer;margin-left:auto}
.addForm .cn{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:transparent;
font-size:14px;cursor:pointer;color:var(--muted)}

/* переключатель участников */
.who{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.who button{flex:1 1 0;min-width:62px;min-height:52px;border-radius:12px;
border:1px solid color-mix(in oklab,var(--line) 55%,transparent);
background:var(--card);cursor:pointer;font-size:13px;padding:5px 3px;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:3px;transition:background .2s var(--ease),transform .16s var(--ease),box-shadow .2s}
.who button:hover{box-shadow:var(--shadow)}
.who button u{text-decoration:none;font-size:10.5px;color:var(--muted)}
.who button .av{width:22px;height:22px;border-radius:50%;background-size:cover;background-position:50% 50%;
display:grid;place-items:center;font-family:var(--serif);font-size:11px;color:#fff}

function normalize(st){
  st.ui=st.ui||{}; if(!st.ui.tab)st.ui.tab='home'; st.ui.open=st.ui.open||{};
  st.gear.forEach(function(g){g.s=g.s||{};g.o=g.o||{};g.ua=g.ua||0;});
  st.buy.forEach(function(p){p.b=!!p.b;p.ua=p.ua||0;if(p.who==null)p.who='';});
  st.route.forEach(function(r){r.ua=r.ua||0;});
  st.ideas.forEach(function(q){q.ua=q.ua||0;});
  st.buySections.forEach(function(s){s.personal=!!s.personal;});
  st.people.forEach(function(p){if(p.photo==null)p.photo='';if(!p.perm)p.perm='member';});
  st.trip.hero=st.trip.hero||'';
  st.tileLabels=st.tileLabels||['Транспорт, лодка, парковка','Продукты и расходники','Общий бюджет','С каждого'];
  st.secTitles=st.secTitles||{};
  return st;
}
function mergeSeed(old,seed){
  var out=cl(old), added=0;
  ['gear','buy','route','ideas'].forEach(function(k){
    var have={};out[k].forEach(function(x){have[x.i]=1;});
    seed[k].forEach(function(x){if(!have[x.i]){var c=cl(x);c.nw=1;out[k].push(c);added++;}});
  });
  var hp={};out.people.forEach(function(p){hp[p.id]=1;});
  seed.people.forEach(function(p){if(!hp[p.id])out.people.push(cl(p));});
  out.gearSections=seed.gearSections;
  var hb={};out.buySections.forEach(function(s){hb[s.id]=1;});
  seed.buySections.forEach(function(s){if(!hb[s.id])out.buySections.push(cl(s));});
  out.logNotes=seed.logNotes;out.trip=seed.trip;out.weather=out.weather||seed.weather;
  out.menu=out.menu||seed.menu;out.seedAdded=added;
  return out;
}
function mergeFile(inc){
  var marks=0,news=0,edits=0;
  (inc.people||[]).forEach(function(ip){
    var mine=S.people.filter(function(p){return p.id===ip.id;})[0];
    if(!mine){S.people.push(cl(ip));news++;return;}
    if(!mine.photo&&ip.photo){mine.photo=ip.photo;edits++;}
  });
  function pick(k,cmp){
    var byId={};S[k].forEach(function(x){byId[x.i]=x;});
    (inc[k]||[]).forEach(function(x){
      var mine=byId[x.i];
      if(!mine){var c=cl(x);c.nw=1;S[k].push(c);news++;return;}
      var r=cmp(mine,x);marks+=r.marks;edits+=r.edits;
    });
  }
  pick('gear',function(a,b){
    var m=0,e=0;
    Object.keys(b.s||{}).forEach(function(p){
      var av=(a.s||{})[p]||0, bv=b.s[p]||0;
      var take=(b.ua||0)>(a.ua||0)?bv:Math.max(av,bv);
      if(take!==av){a.s[p]=take;m++;}
    });
    if((b.ua||0)>(a.ua||0)){
      if(b.n!==a.n){a.n=b.n;e++;}
      if(JSON.stringify(b.o)!==JSON.stringify(a.o)){a.o=cl(b.o);e++;}
      a.ua=b.ua;
    }
    return {marks:m,edits:e};
  });
  pick('buy',function(a,b){
    var m=0,e=0;
    if(!!b.b!==!!a.b){if((b.ua||0)>=(a.ua||0)||b.b){a.b=!!b.b;m++;}}
    if((b.ua||0)>(a.ua||0)){
      ['n','q','pr','st','u','who'].forEach(function(f){if(b[f]!==a[f]){a[f]=b[f];e++;}});
      a.ua=b.ua;
    }
    return {marks:m,edits:e};
  });
  pick('route',function(a,b){
    var m=0,e=0;
    if(!!b.done!==!!a.done){if((b.ua||0)>=(a.ua||0)||b.done){a.done=!!b.done;m++;}}
    if((b.ua||0)>(a.ua||0)){if(b.time!==a.time){a.time=b.time;e++;}a.ua=b.ua;}
    return {marks:m,edits:e};
  });
  pick('ideas',function(a,b){
    var m=0;
    if(!!b.done!==!!a.done){if((b.ua||0)>=(a.ua||0)||b.done){a.done=!!b.done;m++;}}
    return {marks:m,edits:0};
  });
  if((inc.updatedAt||'')>(S.updatedAt||'')){
    S.log=inc.log||S.log; S.menu=inc.menu||S.menu; S.weather=inc.weather||S.weather;
  }
  var who=(inc.author||'').trim(), parts=[];
  if(marks)parts.push(marks+' '+plural(marks,'отметка','отметки','отметок'));
  if(edits)parts.push(edits+' '+plural(edits,'правка','правки','правок'));
  if(news)parts.push(news+' '+plural(news,'новая позиция','новые позиции','новых позиций'));
  touch();render();
  toast(parts.length?('Из файла'+(who?' '+rodit(who):'')+' добавлено: '+parts.join(', ')+'.')
    :'В этом файле нет ничего нового — всё уже отмечено.');
}
function plural(n,a,b,c){var n10=n%10,n100=n%100;
  if(n10===1&&n100!==11)return a; if(n10>=2&&n10<=4&&(n100<10||n100>=20))return b; return c;}

var NB='\u00A0';
function num(n,d){var v=Math.round((+n||0)*Math.pow(10,d||0))/Math.pow(10,d||0);
  return v.toLocaleString('ru-RU',{maximumFractionDigits:d||0});}
function rub(n){return num(n,0)+NB+'\u20BD';}
function ru(n){return num(n,(Math.abs((+n||0)%1)>1e-9)?1:0);}
function L(){return S.log;}
function heads(){return Math.max(1,S.people.length);}
function calc(){
  var l=L(), km=(l.dist*l.kBack+l.local);
  var honda=km*l.consHonda/100*l.p95, aveo=km*l.consAveo/100*l.p95;
  var motoL=l.motoH*l.motoL, moto=motoL*l.p92, saw=l.sawL*l.p92;
  var boat=l.boatDays*l.boatDay, park=l.parkDays*l.parkDay*l.cars;
  var total=honda+aveo+moto+saw+boat+park;
  var l92=motoL+l.sawL, l95=km*l.consHonda/100+km*l.consAveo/100;
  return {km:km,honda:honda,aveo:aveo,moto:moto,motoL:motoL,saw:saw,boat:boat,park:park,
    total:total,l92:l92,l95:l95,cans:Math.ceil(l92/20)};
}
function isPersonal(sec){var s=S.buySections.filter(function(x){return x.id===sec;})[0];return !!(s&&s.personal);}
function buyPrice(p){return (+p.prf>0)?(+p.prf):((+p.pr)||0);}
function buySum(p){return p.st==='buy'?(+p.q||0)*buyPrice(p):0;}
function buyPlanSum(p){return p.st==='buy'?(+p.q||0)*((+p.pr)||0):0;}
function buyPlanShared(){var s=0;S.buy.forEach(function(p){if(!isPersonal(p.sec))s+=buyPlanSum(p);});return s;}
function buySecSum(sec){var t=0;S.buy.forEach(function(p){if(p.sec===sec)t+=buySum(p);});return t;}
function buyShared(){var t=0;S.buy.forEach(function(p){if(!isPersonal(p.sec))t+=buySum(p);});return t;}
function buyPersonal(){var t=0;S.buy.forEach(function(p){if(isPersonal(p.sec))t+=buySum(p);});return t;}
function grand(){var c=calc(),b=buyShared();
  return {trans:c.total,buy:b,all:c.total+b,per:(c.total+b)/heads(),pers:buyPersonal()};}
function pairs(g){var k=Object.keys(g.o||{}).filter(function(p){return (g.o[p]||0)>0;});return k.length?k:['base'];}
function gearProg(who){var d=0,a=0;
  S.gear.forEach(function(g){pairs(g).forEach(function(p){
    if(who&&p!==who)return; a++; if((g.s[p]||0)>=ST_OK)d++;});});
  return {done:d,all:a};}
function secProg(sec,who){var d=0,a=0;
  S.gear.forEach(function(g){if(g.sec!==sec)return;pairs(g).forEach(function(p){
    if(who&&p!==who)return;a++;if((g.s[p]||0)>=ST_OK)d++;});});
  return {done:d,all:a};}
function buyProg(sec){var d=0,a=0;S.buy.forEach(function(p){if(sec&&p.sec!==sec)return;
  if(p.st==='skip'||p.st==='ask')return;a++;if(p.b)d++;});return {done:d,all:a};}
function readiness(){var g=gearProg(null),b=buyProg(null);
  var a=g.all+b.all,d=g.done+b.done;return a?Math.round(d/a*100):0;}
function person(id){for(var i=0;i<S.people.length;i++)if(S.people[i].id===id)return S.people[i];
  return {id:'base',name:'не распределено',ini:'—',color:'#6E7076',photo:''};}

function cropPhoto(p,dataUrl){
  var img=new Image();
  img.onload=function(){
    var BOX=260, base=BOX/Math.min(img.width,img.height), zoom=1, ox=0, oy=0;
    sheet(function(c,close){
      c.appendChild(el('h3',null,'Фотография · '+p.name));
      c.appendChild(el('p',null,'Подвинь снимок пальцем или мышью, чтобы лицо встало в центр. Ползунок — масштаб.'));
      var wrap=el('div','cropWrap'), box=el('div','cropBox');
      var im=el('img'); im.src=dataUrl; box.appendChild(im); wrap.appendChild(box);
      var zr=el('input','zoom'); zr.type='range'; zr.min='1'; zr.max='3'; zr.step='0.01'; zr.value='1';
      zr.setAttribute('aria-label','Масштаб');
      wrap.appendChild(zr);
      wrap.appendChild(el('div','cropHint','Кружок — то, что увидят остальные.'));
      c.appendChild(wrap);
      function draw(){
        var dw=img.width*base*zoom, dh=img.height*base*zoom;
        var maxX=Math.max(0,(dw-BOX)/2), maxY=Math.max(0,(dh-BOX)/2);
        ox=Math.max(-maxX,Math.min(maxX,ox)); oy=Math.max(-maxY,Math.min(maxY,oy));
        im.style.width=dw+'px'; im.style.height=dh+'px';
        im.style.left=(BOX/2-dw/2+ox)+'px'; im.style.top=(BOX/2-dh/2+oy)+'px';
      }
      draw();
      zr.oninput=function(){zoom=parseFloat(zr.value)||1;draw();};
      var drag=null;
      function down(e){drag={x:(e.touches?e.touches[0].clientX:e.clientX),y:(e.touches?e.touches[0].clientY:e.clientY),ox:ox,oy:oy};}
      function move(e){if(!drag)return;
        var x=(e.touches?e.touches[0].clientX:e.clientX),y=(e.touches?e.touches[0].clientY:e.clientY);
        ox=drag.ox+(x-drag.x);oy=drag.oy+(y-drag.y);draw();
        if(e.cancelable)e.preventDefault();}
      function up(){drag=null;}
      box.addEventListener('mousedown',down);window.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
      box.addEventListener('touchstart',down,{passive:true});
      box.addEventListener('touchmove',move,{passive:false});
      box.addEventListener('touchend',up,{passive:true});
      var r=el('div','btnRow');
      var no=el('button',null,'Отмена'), yes=el('button','pri','Поставить');
      r.appendChild(no);r.appendChild(yes);c.appendChild(r);
      function cleanup(){window.removeEventListener('mousemove',move);window.removeEventListener('mouseup',up);}
      no.onclick=function(){cleanup();close();};
      yes.onclick=function(){
        var OUT=420, k=OUT/BOX;
        var cv=document.createElement('canvas');cv.width=OUT;cv.height=OUT;
        var ctx=cv.getContext('2d');
        var dw=img.width*base*zoom, dh=img.height*base*zoom;
        ctx.drawImage(img,(BOX/2-dw/2+ox)*k,(BOX/2-dh/2+oy)*k,dw*k,dh*k);
        p.photo=cv.toDataURL('image/jpeg',0.82);
        touch();cleanup();close();render();toast('Фотография на месте: '+p.name+'.');
      };
    });
  };
  img.onerror=function(){toast('Это не похоже на картинку.');};
  img.src=dataUrl;
}

  var me=S.ui.me||null;
  var lg=el('div','card');
  var leg=el('div','legend');
  ST_NAME.forEach(function(n,i){
    leg.appendChild(el('div','lg','<span class="lgD s'+i+'">'+(i===0?'':svg(ST_ICON[i]))+'</span><span>'+n+'</span>'));
  });
  leg.style.gridTemplateColumns='1fr 1fr';
  lg.appendChild(leg);
  v.appendChild(lg);
  v.appendChild(el('div','hint','Каждый тап по кружку — следующее состояние. В готовность идёт «упаковано» и «в машине».'));
  var sp=el('div');sp.style.height='14px';v.appendChild(sp);

  var who=el('div','who');
  var all=gearProg(null);
  var bAll=el('button',(me?'':'on'),'<span>Все</span><u>'+all.done+'/'+all.all+'</u>');
  bAll.onclick=function(){S.ui.me=null;persist();renderSec('gear');};who.appendChild(bAll);
  S.people.forEach(function(p){
    var pr=gearProg(p.id);
    var b=el('button',(me===p.id?'on':''),avaHtml(p)+'<span>'+esc(p.name)+'</span><u>'+pr.done+'/'+pr.all+'</u>');
    b.onclick=function(){S.ui.me=p.id;persist();renderSec('gear');};who.appendChild(b);
  });
  v.appendChild(who);
  v.appendChild(el('div','hint', me
    ? ('Личный список · '+person(me).name+' — '+gearProg(me).all+' позиций из общей базы. Отметки видны всем в режиме «Все».')
    : 'Общая база. У каждой вещи видно, кто её везёт и на какой стадии. Тап по кружку участника отмечает за него.'));

  S.gearSections.forEach(function(sc){
    var items=S.gear.filter(function(g){
      if(g.sec!==sc.id)return false;
      if(me&&!(g.o[me]>0))return false;
      if(searchQ&&g.n.toLowerCase().indexOf(searchQ)<0)return false;
      return true;});
    if(searchQ&&!items.length)return;
    var pg=secProg(sc.id,me);
    var key='g_'+sc.id+(me||'');
    var closed=S.ui.open[key]===false||(S.ui.open[key]==null&&!searchQ&&sc.id!=='od');
    var grp=el('div','grp'+(closed?' closed':''));
    var h=el('button','grpH','<span class="grpCnt">'+pg.done+'\u2009/\u2009'+pg.all+'</span>'
      +'<span class="grpName">'+esc(sc.t)+'</span>'
      +'<span class="grpBar"><i style="width:'+(pg.all?pg.done/pg.all*100:0)+'%"></i></span>'+svg('chev','chev'));
    h.onclick=function(){toggleGrp(grp,key);};
    grp.appendChild(h);
    var body=el('div','grpBody');
    lazyBody(grp,body,function(b){
      items.forEach(function(g,ix){var r=gearRow(g,me,grp,sc.id);r.style.setProperty('--d',Math.min(ix,12)*14+'ms');b.appendChild(r);});
      if(!items.length&&!searchQ)b.appendChild(el('div','empty','<b>Здесь пусто</b>Из этого раздела ты ничего не везёшь. Добавь строкой ниже, если что-то вспомнил.'));
      b.appendChild(gearAdd(grp,sc.id,me,b));
    });
    grp.appendChild(body);
    v.appendChild(grp);
  });
}
function updSecHead(grp,sec,me){
  var pg=secProg(sec,me);
  $('.grpCnt',grp).textContent=pg.done+'\u2009/\u2009'+pg.all;
  $('.grpBar i',grp).style.width=(pg.all?pg.done/pg.all*100:0)+'%';
}
function chkBtn(getS,setS,after){
  var b=el('button','chk');
  function paint(anim){
    var s=getS();b.dataset.s=s;b.title=ST_NAME[s];
    b.setAttribute('aria-label','Состояние: '+ST_NAME[s]);
    b.innerHTML=s>0?svg(ST_ICON[s]):'';
    if(anim&&s>0){b.classList.remove('mark');requestAnimationFrame(function(){b.classList.add('mark');});}
    else b.classList.toggle('mark',s>0);
  }
  paint(false);
  b.onclick=function(ev){
    ev.stopPropagation();setS((getS()+1)%ST_N);paint(true);
    b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
    if(after)after();
  };
  b.repaint=paint; return b;
}
function gearRow(g,me,grp,sec){
  var row=el('div','row'), inn=el('div','rowIn');
  row.appendChild(el('div','rowDel','Удалить')); row.appendChild(inn);
  var top=el('div','rowTop');
  function doneNow(){return me?((g.s[me]||0)>=ST_OK):pairs(g).every(function(p){return (g.s[p]||0)>=ST_OK;});}
  g.q=g.q||{};
  function refresh(){inn.classList.toggle('done',doneNow());updSecHead(grp,sec,me);}
  var stLbl=null;
  if(me){
    var ch=chkBtn(function(){return g.s[me]||0;},function(n){g.s[me]=n;itouch(g);},function(){
      refresh(); if(stLbl){stLbl.textContent=ST_NAME[g.s[me]||0];stLbl.dataset.s=g.s[me]||0;}
    });
    top.appendChild(ch);
  }else{
    var ph=el('span');ph.style.cssText='width:30px;flex:0 0 auto';top.appendChild(ph);
  }
  var wrap=el('div');wrap.style.cssText='flex:1;min-width:0';
  var nm=el('div','rowName');
  var strike=el('span','strike');strike.textContent=g.n;nm.appendChild(strike);
  if(g.nw)nm.appendChild(el('i','newDot'));
  nm.contentEditable='true';nm.spellcheck=false;
  nm.onblur=function(){var t=(nm.textContent||'').trim();
    if(!t){nm.innerHTML='';nm.appendChild(strike);return;}
    g.n=t;itouch(g);nm.innerHTML='';strike.textContent=t;nm.appendChild(strike);};
  nm.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();nm.blur();}};
  wrap.appendChild(nm);
  wrap.appendChild(edText(function(){return g.c;},function(x){g.c=x;itouch(g);},'edN','описание, размер, нюансы'));
  if(me){stLbl=el('span','stLbl');stLbl.dataset.s=g.s[me]||0;stLbl.textContent=ST_NAME[g.s[me]||0];wrap.appendChild(stLbl);}
  top.appendChild(wrap);
  inn.appendChild(top);
  var qWho=me||null, qNode=el('div');
  function paintQ(){
    qNode.innerHTML='';
    var keys=Object.keys(g.q||{}).filter(function(k){return g.q[k];});
    if(qWho&&g.q[qWho]){
      qNode.appendChild(el('div','askTxt',svg('ask')+'<span><b>Под вопросом:</b> '+esc(g.q[qWho])+'</span>'));
      inn.classList.add('askRow');
    }else if(!qWho&&keys.length){
      keys.forEach(function(k){
        qNode.appendChild(el('div','askTxt',svg('ask')+'<span><b>'+esc(person(k).name)+': под вопросом.</b> '+esc(g.q[k])+'</span>'));
      });
      inn.classList.add('askRow');
    }else inn.classList.remove('askRow');
  }
  inn.appendChild(qNode);

  var bot=el('div','rowBot');
  if(me){
    bot.appendChild(stepper(function(){return g.o[me]||0;},function(n){g.o[me]=n;itouch(g);},'шт.'));
    var mv=el('button','pchip','<span>'+svg('user','gl')+'</span><b>передать</b>');
    mv.title='Передать другому участнику';
    mv.onclick=function(){movePerson(g,me);};
    bot.appendChild(mv);
    var ab=el('button','askB'+(g.q[me]?' on':''),svg('ask')+'<span>'+(g.q[me]?'под вопросом':'не могу взять')+'</span>');
    ab.onclick=function(){askSheet(g,me,function(){paintQ();
      ab.className='askB'+(g.q[me]?' on':'');
      ab.innerHTML=svg('ask')+'<span>'+(g.q[me]?'под вопросом':'не могу взять')+'</span>';});};
    bot.appendChild(ab);
  }else{
    pairs(g).forEach(function(p){
      if(p==='base'){
        var cb=el('button','pchip base');cb.dataset.s=g.s.base||0;
        cb.innerHTML='<span class="av" style="background:#8A8F94">'+svg('user','gl')+'</span><b>никто</b>'+svg(ST_ICON[g.s.base||0],'gl');
        cb.title='Пока не распределено · '+ST_NAME[g.s.base||0];
        cb.onclick=function(){g.s.base=((g.s.base||0)+1)%ST_N;itouch(g);
          cb.dataset.s=g.s.base;cb.innerHTML='<span class="av" style="background:#8A8F94">'+svg('user','gl')+'</span><b>никто</b>'+svg(ST_ICON[g.s.base],'gl');
          cb.title='Пока не распределено · '+ST_NAME[g.s.base];
          cb.classList.remove('pop');void cb.offsetWidth;cb.classList.add('pop');refresh();};
        bot.appendChild(cb);return;
      }
      var pp=person(p), c=el('button','pchip');
      function paint(){
        c.dataset.s=g.s[p]||0;
        c.innerHTML=avaHtml(pp)+'<b>'+esc(pp.ini)+'</b><span>'+ru(g.o[p])+'</span>'+svg(ST_ICON[g.s[p]||0],'gl');
        c.title=pp.name+' · '+ru(g.o[p])+' шт. · '+ST_NAME[g.s[p]||0];
      }
      paint();
      c.onclick=function(){g.s[p]=((g.s[p]||0)+1)%ST_N;itouch(g);paint();
        c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop');refresh();};
      bot.appendChild(c);
    });
    var sum=0;Object.keys(g.o).forEach(function(k){sum+=g.o[k]||0;});
    if(sum)bot.appendChild(el('span','totMini','всего '+ru(sum)));
    var asg=el('button','pchip','<b>+ назначить</b>');
    asg.title='Назначить, кто везёт';
    asg.onclick=function(){assignSheet(g);};
    bot.appendChild(asg);
    var ab2=el('button','askB'+(Object.keys(g.q||{}).filter(function(k){return g.q[k];}).length?' on':''),
      svg('ask')+'<span>не могу взять</span>');
    ab2.title='Отметить, что кто-то не может взять эту вещь';
    ab2.onclick=function(){
      sheet(function(c2,close2){
        c2.appendChild(el('h3',null,'Кто не может взять «'+g.n+'»?'));
        c2.appendChild(el('p',null,'Причину увидят все — вещь подсветится, её можно передать другому.'));
        S.people.forEach(function(pp){
          var it=el('button','mItem','<span>'+esc(pp.name)+'</span>'+(g.q[pp.id]?'<u>под вопросом</u>':''));
          it.insertBefore(document.createRange().createContextualFragment(avaHtml(pp)),it.firstChild);
          $('.av',it).style.cssText+=';width:26px;height:26px;font-size:12px';
          it.onclick=function(){close2();askSheet(g,pp.id,function(){renderSec('gear');});};
          c2.appendChild(it);
        });
      });
    };
    bot.appendChild(ab2);
  }
  var del=el('button','trashB',svg('trash'));del.title='Удалить позицию';
  del.onclick=function(){delGear(g,row,grp,sec,me);};
  bot.appendChild(del);
  inn.appendChild(bot);
  if(doneNow())inn.classList.add('done');
  paintQ();
  swipeDel(row,inn,function(){delGear(g,row,grp,sec,me);});
  return row;
}
function askSheet(g,who,after){
  sheet(function(c,close){
    c.appendChild(el('h3',null,g.q[who]?'Что с «'+g.n+'»?':'Не могу взять «'+g.n+'»'));
    c.appendChild(el('p',null,'Причину увидят все — вещь подсветится и её можно будет передать другому.'));
    var f=el('div','fld');var inp=el('input');inp.placeholder='Например: палатки у меня нет';
    inp.value=g.q[who]||'';f.appendChild(inp);c.appendChild(f);
    var r=el('div','btnRow');
    var no=el('button',null,g.q[who]?'Снять вопрос':'Отмена'), yes=el('button','pri','Сохранить');
    r.appendChild(no);r.appendChild(yes);c.appendChild(r);
    setTimeout(function(){inp.focus();},80);
    no.onclick=function(){if(g.q[who]){delete g.q[who];itouch(g);}close();if(after)after();};
    yes.onclick=function(){
      var v2=(inp.value||'').trim();
      if(v2)g.q[who]=v2; else delete g.q[who];
      itouch(g);close();if(after)after();
      if(v2)toast('«'+g.n+'» под вопросом. Причину видят все.');
    };
  });
}
function delGear(g,row,grp,sec,me){
  if(!canDel(g))return needEditor();
  var ix=S.gear.indexOf(g); if(ix<0)return;
  S.gear.splice(ix,1);touch();row.remove();updSecHead(grp,sec,me);
  toast('«'+g.n+'» удалено.','Отменить',function(){S.gear.splice(ix,0,g);touch();render();},6000);
}
function movePerson(g,from){
  sheet(function(c,close){
    c.appendChild(el('h3',null,'Кто повезёт «'+g.n+'»?'));
    c.appendChild(el('p',null,'Количество и отметка перейдут вместе с вещью.'));
    S.people.forEach(function(p){
      if(p.id===from)return;
      var it=el('button','mItem','<span>'+esc(p.name)+'</span>');
      it.insertBefore(document.createRange().createContextualFragment(avaHtml(p)),it.firstChild);
      $('.av',it).style.cssText+=';width:26px;height:26px;font-size:12px';
      it.onclick=function(){
        var q=g.o[from]||1, st=g.s[from];
        delete g.o[from]; g.o[p.id]=(g.o[p.id]||0)+q;
        if(st!=null){g.s[p.id]=st;delete g.s[from];}
        itouch(g);close();render();
        toast('«'+g.n+'» теперь везёт '+p.name+'.','Отменить',function(){
          var qq=g.o[p.id]||1;delete g.o[p.id];g.o[from]=qq;
          if(g.s[p.id]!=null){g.s[from]=g.s[p.id];delete g.s[p.id];}
          itouch(g);render();},6000);
      };
      c.appendChild(it);
    });
    var r=el('div','btnRow');var no=el('button',null,'Отмена');no.onclick=close;r.appendChild(no);c.appendChild(r);
  });
}
function assignSheet(g){
  sheet(function(c,close){
    c.appendChild(el('h3',null,'Кто везёт «'+g.n+'»'));
    c.appendChild(el('p',null,'Поставь количество тому, кто берёт эту вещь. Ноль — не везёт.'));
    S.people.forEach(function(p){
      var r=el('div','pRow');
      var d=el('div');
      d.appendChild(document.createRange().createContextualFragment('<em>'+esc(p.name)+'</em>'));
      r.appendChild(d);
      r.appendChild(stepper(function(){return g.o[p.id]||0;},function(n){
        if(n<=0)delete g.o[p.id];else g.o[p.id]=n; itouch(g);},''));
      c.appendChild(r);
    });
    var r2=el('div','btnRow');var ok=el('button','pri','Готово');
    ok.onclick=function(){close();render();};r2.appendChild(ok);c.appendChild(r2);
  });
}
function stepper(get,set,unit){
  var w=el('div','stp');
  var minus=el('button',null,svg('minus')), inp=el('input'), plus=el('button',null,svg('plus'));
  inp.type='text';inp.inputMode='decimal';inp.value=ru(get());
  minus.setAttribute('aria-label','Меньше');plus.setAttribute('aria-label','Больше');
  function put(v){v=Math.max(0,v);inp.value=ru(v);set(v);}
  minus.onclick=function(){put((+get()||0)-1);};
  plus.onclick=function(){put((+get()||0)+1);};
  inp.onchange=function(){put(parseFloat(String(inp.value).replace(',','.'))||0);};
  w.appendChild(minus);w.appendChild(inp);w.appendChild(plus);
  if(unit)w.appendChild(el('span','stpU',unit));
  return w;
}
/* добавление снаряжения: название + кому + сколько */
function gearAdd(grp,sec,me,body){
  var btn=el('button','addRow',svg('plus')+'<span>Добавить вещь в этот раздел</span>');
  btn.onclick=function(){openForm();};
  function openForm(){
    var who=me||(S.people[0]&&S.people[0].id)||'', qty=1;
    var f=el('div','addForm');
    var inp=el('input','nm');inp.placeholder='Что берём';
    f.appendChild(inp);
    f.appendChild(el('div','lbl','Кто везёт'));
    var chips=el('div','rowA');
    S.people.forEach(function(p){
      var c=el('button','pchip'+(who===p.id?' sel':''),avaHtml(p)+'<b>'+esc(p.name)+'</b>');
      c.onclick=function(){who=p.id;$$('.pchip',chips).forEach(function(x){x.classList.remove('sel');});c.classList.add('sel');};
      chips.appendChild(c);
    });
    var cNone=el('button','pchip'+(who?'':' sel'),'<b>пока никто</b>');
    cNone.onclick=function(){who='';$$('.pchip',chips).forEach(function(x){x.classList.remove('sel');});cNone.classList.add('sel');};
    chips.appendChild(cNone);
    f.appendChild(chips);
    f.appendChild(el('div','lbl','Сколько'));
    var r=el('div','rowA');
    r.appendChild(stepper(function(){return qty;},function(n){qty=n;},'шт.'));
    var cancel=el('button','cn','Закрыть'), go2=el('button','go','Добавить');
    r.appendChild(cancel);r.appendChild(go2);
    f.appendChild(r);
    btn.parentNode.replaceChild(f,btn);
    inp.focus();
    function commit(){
      var t=(inp.value||'').trim(); if(!t){inp.focus();return;}
      var g={i:'g_'+Date.now().toString(36)+Math.floor(Math.random()*99),sec:sec,n:t,o:{},s:{},q:{},by:(S.ui.me||''),nw:1,ua:Date.now()};
      if(who)g.o[who]=qty||1;
      S.gear.push(g);touch();
      var node=gearRow(g,me,grp,sec);
      f.parentNode.insertBefore(node,f);
      updSecHead(grp,sec,me);
      inp.value='';inp.focus();
      toast('«'+t+'» добавлено'+(who?(' · везёт '+person(who).name):' · пока никто не везёт')+'.');
    }
    inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();commit();}else if(e.key==='Escape')done();};
    go2.onclick=commit; cancel.onclick=done;
    function done(){if(f.parentNode)f.parentNode.replaceChild(btn,f);}
  }
  return btn;
}
function swipeDel(row,inn,onDel){
  var x0=null,dx=0;
  row.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;x0=e.touches[0].clientX;dx=0;row.classList.add('sw');},{passive:true});
  row.addEventListener('touchmove',function(e){
    if(x0==null)return;dx=e.touches[0].clientX-x0;
    if(dx>0)dx=0;if(dx<-124)dx=-124;
    inn.style.transform='translateX('+dx+'px)';},{passive:true});
  row.addEventListener('touchend',function(){
    row.classList.remove('sw');
    if(dx<-70){inn.style.transform='translateX(-100%)';setTimeout(onDel,180);}
    else inn.style.transform='';
    x0=null;},{passive:true});
}

function viewBuy(v){

    var items=S.buy.filter(function(p){
      if(p.sec!==sc.id)return false;
      if(searchQ&&p.n.toLowerCase().indexOf(searchQ)<0)return false;
      return true;});
    if(searchQ&&!items.length)return;
    var pg=buyProg(sc.id), key='b_'+sc.id;
    var closed=S.ui.open[key]===false||(S.ui.open[key]==null&&!searchQ&&sc.id!=='byt');
    var grp=el('div','grp'+(closed?' closed':''));grp.dataset.sec=sc.id;
    var h=el('button','grpH','<span class="grpCnt">'+pg.done+'\u2009/\u2009'+pg.all+'</span>'

      +'<span class="grpBar"><i style="width:'+(pg.all?pg.done/pg.all*100:0)+'%"></i></span>'+svg('chev','chev'));

      b.appendChild(buyAdd(grp,sc.id,b));
      b.appendChild(el('div','subTot'+(sc.personal?' pers':''),

}

function updBuyHead(grp){

  if(pulling)return Promise.resolve();
  pulling=true;
  return sbFetch('trips?id=eq.'+TRIP_ID+'&select=data,updated_at,author')
   .then(function(r){ if(!r.ok)throw new Error('HTTP '+r.status); return r.json(); })
   .then(function(rows){
     pulling=false;
     if(!rows.length){ return push(true).then(function(){setNet('ok','создан на сервере');}); }
     var row=rows[0];
     if(!force && row.updated_at===lastPull){setNet('ok');return;}
     var mine=S.updatedAt||'';
     var theirs=(row.data&&row.data.updatedAt)||'';
     lastPull=row.updated_at;
     if(force||theirs>mine){
       var keepMe=S.ui&&S.ui.me, keepTab=S.ui&&S.ui.tab;
       S=normalize(mergeSeed(normalize(row.data),SEED));
       if(keepMe)S.ui.me=keepMe; if(keepTab)S.ui.tab=keepTab;
       render(); setNet('ok','обновлено с сервера');
       setTimeout(function(){setNet('ok');},2000);
     } else setNet('ok');
   })
   .catch(function(e){pulling=false;setNet('err','нет связи с сервером');});
}
function push(create){
  setNet('work');
  S.author=(S.ui&&S.ui.me)?person(S.ui.me).name:'';
  var body={id:TRIP_ID,data:S,updated_at:new Date().toISOString(),author:S.author};
  return sbFetch('trips',{method:'POST',body:[body],
    headers:{'Prefer':'resolution=merge-duplicates,return=representation'}})
   .then(function(r){
     if(!r.ok)throw new Error('HTTP '+r.status);
     return r.json();
   })
   .then(function(rows){ if(rows&&rows[0])lastPull=rows[0].updated_at; setNet('ok'); })
   .catch(function(e){setNet('err','правки не ушли на сервер');});
}
function schedulePush(){
  if(pushT)clearTimeout(pushT);
  setNet('work');
  pushT=setTimeout(function(){pushT=null;push();},900);
}

/* перехватываем touch(): любое изменение уходит на сервер */
var touchBase=touch;
touch=function(){ touchBase(); if(ONLINE)schedulePush(); };

/* ── версии ── */
function saveVersion(note){
  return sbFetch('trip_versions',{method:'POST',rep:true,
    body:[{trip_id:TRIP_ID,data:S,author:(S.ui&&S.ui.me)?person(S.ui.me).name:'',note:note||''}]})
   .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
}
function listVersions(){
  return sbFetch('trip_versions?trip_id=eq.'+TRIP_ID+'&select=id,author,note,created_at&order=created_at.desc&limit=30')
   .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
}
function loadVersion(id){
  return sbFetch('trip_versions?id=eq.'+id+'&select=data')
   .then(function(r){return r.json();});
}
function delVersion(id){
  return sbFetch('trip_versions?id=eq.'+id,{method:'DELETE'});
}
function fmtWhen(iso){
  var d=new Date(iso);
  var mm=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
  return d.getDate()+' '+mm[d.getMonth()]+', '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
function versionsSheet(){
  sheet(function(c,close){
    c.appendChild(el('h3',null,'Версии на сервере'));
    c.appendChild(el('p',null,'Снимок текущего состояния можно сохранить и вернуться к нему позже.'));
    var mk=el('button','mItem',svg('dl')+'<span>Сохранить версию сейчас</span>');
    mk.onclick=function(){
      close();
      sheet(function(c2,cl2){
        c2.appendChild(el('h3',null,'Что за версия?'));
        var f=el('div','fld');var inp=el('input');inp.placeholder='Например: перед закупкой';f.appendChild(inp);c2.appendChild(f);
        var r=el('div','btnRow');
        var no=el('button',null,'Отмена'),yes=el('button','pri','Сохранить');
        r.appendChild(no);r.appendChild(yes);c2.appendChild(r);
        no.onclick=cl2;
        setTimeout(function(){inp.focus();},80);
        yes.onclick=function(){
          var n=(inp.value||'').trim();
          cl2(); setNet('work');
          saveVersion(n).then(function(){setNet('ok');toast('Версия сохранена.');},
            function(){setNet('err');toast('Не получилось сохранить версию.');});
        };
      });
    };
    c.appendChild(mk);
    var box=el('div');box.appendChild(el('p',null,'Загружаю список…'));
    c.appendChild(box);
    listVersions().then(function(rows){
      box.innerHTML='';
      if(!rows.length){box.appendChild(el('p',null,'Версий пока нет.'));return;}
      rows.forEach(function(v){
        var it=el('button','mItem',svg('file')+'<span>'+esc(fmtWhen(v.created_at))
          +(v.author?(' · '+esc(v.author)):'')+(v.note?('<br><u style="margin:0">'+esc(v.note)+'</u>'):'')+'</span>');
        var dl=el('span');dl.style.cssText='margin-left:auto;color:#A8442E;font-size:12px';dl.textContent='убрать';
        dl.onclick=function(ev){
          ev.stopPropagation();
          if(!isEditor()){needEditor();return;}
          delVersion(v.id).then(function(){it.remove();toast('Версия убрана.');});
        };
        it.appendChild(dl);
        it.onclick=function(){
          if(!isEditor()){needEditor();return;}
          setNet('work');
          loadVersion(v.id).then(function(rr){
            if(!rr.length)return;
            S=normalize(mergeSeed(normalize(rr[0].data),SEED));
            touch();render();close();toast('Вернулись к версии от '+fmtWhen(v.created_at)+'.');
          });
        };
        box.appendChild(it);
      });
    },function(){box.innerHTML='';box.appendChild(el('p',null,'Список не загрузился — нет связи.'));});
  });
}

/* ── погода из Open-Meteo ── */
var WX={0:'Ясно',1:'В основном ясно',2:'Переменная облачность',3:'Облачно',45:'Туман',48:'Туман с изморозью',
 51:'Слабая морось',53:'Морось',55:'Сильная морось',61:'Небольшой дождь',63:'Дождь',65:'Сильный дождь',
 71:'Небольшой снег',73:'Снег',75:'Сильный снег',80:'Кратковр. дождь',81:'Кратковр. дождь',82:'Ливни',
 95:'Гроза',96:'Гроза с градом',99:'Гроза с градом'};
function placeQuery(){
  var p=(S.trip.place||'').split('·')[0].trim();
  return p||'Приозерск';
}
function pad2(n){return ('0'+n).slice(-2);}
function tripDates(){
  var start=new Date(S.trip.start), out=[];
  var n=Math.max(1,(S.weather&&S.weather.days?S.weather.days.length:5));
  for(var i=0;i<n;i++){
    var d=new Date(start.getTime()+i*86400000);
    out.push(d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()));
  }
  return out;
}
function refreshWeather(silent){
  var q=placeQuery();
  setNet('work','погода…');
  return fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=ru&format=json&name='+encodeURIComponent(q))
   .then(function(r){return r.json();})
   .then(function(g){
     if(!g.results||!g.results.length)throw new Error('место не найдено');
     var pt=g.results[0], ds=tripDates();
     S.trip.lat=pt.latitude;S.trip.lon=pt.longitude;
     return fetch('https://api.open-meteo.com/v1/forecast?latitude='+pt.latitude+'&longitude='+pt.longitude
      +'&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,windspeed_10m_max'
      +'&timezone=auto&start_date='+ds[0]+'&end_date='+ds[ds.length-1])
      .then(function(r){return r.json();}).then(function(f){return {pt:pt,f:f,ds:ds};});
   })
   .then(function(o){
     var d=o.f&&o.f.daily;
     if(!d||!d.time||!d.time.length)throw new Error('прогноза на эти даты пока нет');
     var WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
     var days=d.time.map(function(iso,i){
       var dt=new Date(iso+'T12:00:00');
       var wc=d.weathercode[i];
       var pp=d.precipitation_probability_max?d.precipitation_probability_max[i]:null;
       return {i:'w'+(i+1),d:pad2(dt.getDate())+'.'+pad2(dt.getMonth()+1),wd:WD[dt.getDay()],
         day:Math.round(d.temperature_2m_max[i]),night:Math.round(d.temperature_2m_min[i]),
         prec:(WX[wc]||'—')+(pp!=null?(' ('+pp+' %)'):''),
         wind:Math.round(d.windspeed_10m_max[i]/3.6)+' м/с',
         means:(S.weather.days[i]&&S.weather.days[i].means)||''};
     });
     S.weather.days=days;
     S.weather.updated=fmtWhen(new Date().toISOString());
     S.weather.src='Прогноз Open-Meteo для «'+o.pt.name+'» ('+o.pt.latitude.toFixed(2)+', '
       +o.pt.longitude.toFixed(2)+'), обновлён '+S.weather.updated+'.';
     touch();renderSec('home');
     setNet('ok','погода обновлена');
     setTimeout(function(){setNet('ok');},2000);
     if(!silent)toast('Прогноз обновлён по месту «'+o.pt.name+'».');
   })
   .catch(function(e){
     setNet('ok');
     if(!silent)toast('Погода не обновилась: '+(e&&e.message?e.message:'нет связи')+'.');
   });
}

/* ── скачать офлайн-копию / загрузить офлайн-файл ── */
function downloadOffline(){
  refreshWeather(true).then(function(){ saveFile(); });
}
function uploadOffline(){ document.getElementById('fileIn').click(); }

/* ── роль из ссылки ── */
function applyUrlUser(){
  var m=(location.search||'').match(/[?&]u=([^&]+)/);
  if(!m)return;
  var id=decodeURIComponent(m[1]).toLowerCase();
  var found=null;
  S.people.forEach(function(p){
    if(p.id===id||(p.name||'').toLowerCase()===id)found=p;
  });
  if(found){S.ui.me=found.id;}
}

/* ── меню «⋯»: онлайн-пункты ── */
function mountMenu(){
  var btn=document.getElementById('bMenu');
  if(!btn)return;
  btn.onclick=function(){
    sheet(function(c,close){
      c.appendChild(el('h3',null,'Ещё'));
      var me=meP();
      c.appendChild(el('p',null,me?('Ты — '+me.name+' · '+permName(me)):'Ты не выбран — открой «Экипаж» и выбери себя.'));
      var i0=el('button','mItem',svg('dl')+'<span>Скачать офлайн-копию</span><u>с сегодняшней погодой</u>');
      i0.onclick=function(){close();downloadOffline();};
      var i1=el('button','mItem',svg('file')+'<span>Загрузить офлайн-файл в онлайн</span>');
      i1.onclick=function(){close();uploadOffline();};
      var i2=el('button','mItem',svg('clock')+'<span>Версии на сервере</span>');
      i2.onclick=function(){close();versionsSheet();};
      var i3=el('button','mItem',svg('cloud')+'<span>Обновить прогноз погоды</span>');
      i3.onclick=function(){close();refreshWeather();};
      var i4=el('button','mItem',svg('txt')+'<span>Экспорт в текст для Телеграма</span>');
      i4.onclick=function(){close();exportText();};
      var cur=THEMES.filter(function(x){return x[0]===(S.theme||null);})[0];
      var i5=el('button','mItem',svg('theme')+'<span>Тема</span><u>'+cur[1]+'</u>');
      i5.onclick=function(){
        var ix=THEMES.map(function(x){return x[0];}).indexOf(S.theme||null);
        S.theme=THEMES[(ix+1)%3][0];touch();applyTheme();close();
      };
      var i6=el('button','mItem',svg('user')+'<span>Ссылки для экипажа</span>');
      i6.onclick=function(){close();linksSheet();};
      [i0,i1,i2,i3,i4,i5,i6].forEach(function(x){c.appendChild(x);});
      if(isEditor()){
        var i7=el('button','mItem dang',svg('trash')+'<span>Сбросить все отметки</span>');
        i7.onclick=function(){close();confirmReset();};
        c.appendChild(i7);
      }
    });
  };
}
function linksSheet(){
  sheet(function(c,close){
    c.appendChild(el('h3',null,'Ссылки для экипажа'));
    c.appendChild(el('p',null,'У каждого своя ссылка — она сразу выбирает его в списке и даёт его права. Скинь каждому свою.'));
    var base=location.href.split('?')[0];
    S.people.forEach(function(p){
      var url=base+'?u='+encodeURIComponent(p.id);
      var it=el('button','mItem','<span>'+esc(p.name)+' · '+permName(p)+'<br><u style="margin:0;font-size:11.5px">'+esc(url)+'</u></span>');
      it.insertBefore(document.createRange().createContextualFragment(avaHtml(p)),it.firstChild);
      var av=it.querySelector('.av'); if(av)av.style.cssText+=';width:26px;height:26px;font-size:12px';
      it.onclick=function(){
        var ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);
        ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}
        ta.remove();
        if(!ok&&navigator.clipboard)navigator.clipboard.writeText(url);
        toast('Ссылка для '+p.name+' скопирована.');
      };
      c.appendChild(it);
    });
  });
}

/* ── старт онлайна ── */
(function startOnline(){
  mountSyncBar(); mountMenu(); applyUrlUser();
  setNet('work','подключаюсь…');
  pull(false).then(function(){
    var stamp=(S.weather&&S.weather.updated)||'';
    if(!S.trip.lat||!/\d{2}:\d{2}/.test(stamp))refreshWeather(true);
  });
  setInterval(function(){ if(!document.hidden)pull(false); },4000);
  window.addEventListener('online',function(){setNet('work');pull(false);});
  window.addEventListener('offline',function(){setNet('off','нет сети — правки в браузере');});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)pull(false);});
})();
