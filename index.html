    <title>Pine-to-Pine</title>
    <!-- ⛔ Название поездки в заголовок и описание не пишем: их читает любой, кто
         открыл адрес, и они попадают в поиск. Слово заказчика 05.08.2026 — «убрать
         название поездки». Поездка называет себя уже внутри, после входа по личной
         ссылке (урок У-65 — то же правило, только про сборку). -->
    <meta name="description" content="Лист планирования поездки." />
    <!-- Цвет шапки браузера. Тег ОДИН и без `media`: встроенный браузер Телеграма
         красит свою полоску (крестик, адрес, «⋯») именно по нему, а вариант с `media`
         читает системную тему — и когда человек переключил тему внутри сайта, полоска
         оставалась чужого цвета и просвечивала. Значение меняет src/theme.ts, а первое
         выставляет скрипт ниже, до первой отрисовки. -->
    <meta name="theme-color" content="#F9F3D4" />
    <!-- ⛔ `apple-mobile-web-app-capable` НЕ ставим. С ним значок на домашнем экране
         iPhone запускает ОТДЕЛЬНОЕ приложение со своим хранилищем: вход, сделанный
         в Safari, туда не переезжает, и человек упирается в «Этот лист закрыт»,
         а при следующем запуске видит замерший снимок этого экрана — iOS показывает
         его как заставку, и он, конечно, не нажимается. Заказчик 06.08.2026:
         «я уже должен быть зарегистрирован, мне не нужно повторять эту процедуру».
         Без этой меты значок — закладка Safari: тот же вход, те же данные,
         открывается сразу в листе (У-106). Имя и значок закладки берутся из
         `apple-mobile-web-app-title` и `apple-touch-icon` ниже. -->
    <meta name="apple-mobile-web-app-title" content="Pine-to-Pine" />
    <!-- ./ подставляет Vite: './' для GitHub Pages и офлайн-копии, '/' для
         Cloudflare Pages. Жёсткое './' здесь ломало красивые адреса: со страницы
         /vuoksa2026/Maks манифест и значок искались в несуществующей папке. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
