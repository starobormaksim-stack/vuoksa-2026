<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PackFlow · Вуокса-2026</title>
<style id="app-css-hero">.heroPic{background-image:url(__HERO__)}</style>
<style id="app-css">
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
:root{
--night:#1B2B2E;--night2:#132022;--pine:#25473A;--amber:#BC6C25;--amberDeep:#A74612;--amberLt:#F3E4CD;
--water:#3E6B7A;--bark:#7C5433;--moss:#5E7A5A;
--cream:#FCF9F3;--zebra:#F2EDE3;--line:#D8CFBF;--ink:#1E2723;--muted:#6C7570;
--bg:var(--cream);--card:#FFFFFF;--head:rgba(251,247,240,.84);
--shadow:0 1px 2px rgba(30,42,50,.05),0 10px 30px rgba(30,42,50,.07);
--shadowUp:0 2px 4px rgba(30,42,50,.07),0 18px 44px rgba(30,42,50,.11);
--serif:Georgia,"Times New Roman",serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
--ease:cubic-bezier(.2,.8,.2,1);
--r:16px;
}
/* тёмная тема — глубокая хвоя: фон еловой тени, текст песочный, акценты коры сосны */
html[data-theme="dark"]{
--bg:#0E1F1A;--card:#162B24;--zebra:#13251F;--line:#2B4438;--ink:#EFE7D8;--muted:#9AACA1;
--pine:#6FA98D;--water:#6FA0B0;--bark:#C08A57;--moss:#8AA486;--amber:#D8944A;--amberDeep:#C0762A;
--amberLt:#33291D;--cream:#122420;--head:rgba(14,31,26,.86);
--shadow:0 1px 2px rgba(0,0,0,.34),0 10px 30px rgba(0,0,0,.36);
--shadowUp:0 2px 6px rgba(0,0,0,.38),0 18px 44px rgba(0,0,0,.44);
}
/* на посветлевшей хвое галочки должны быть тёмными, иначе сливаются */
html[data-theme="dark"] .tlD.on svg{stroke:#0E1F1A}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.45;
letter-spacing:.002em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{letter-spacing:.005em}
.money,.cdN,.ringPct,.totRow b,.tile b,.grpCnt{font-feature-settings:"tnum" 1;letter-spacing:.01em}
@media (max-width:420px){
  body{font-size:15px}
  .pageH h2{font-size:24px}
  .heroTxt h1{font-size:30px}
  .tile b{font-size:22px}
}
body,input,select,button,textarea{font-variant-numeric:tabular-nums}
input,select,button,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:400}
a{color:var(--amber);text-decoration:none}
a:hover{color:var(--ink)}
::selection{background:var(--amberLt)}

/* ── shell ─────────────────────────────── */
.shell{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.hdr{position:sticky;top:0;z-index:40;background:var(--head);padding-top:env(safe-area-inset-top);
-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
border-bottom:1px solid color-mix(in oklab,var(--line) 42%,transparent)}
.hdrIn{display:flex;align-items:center;gap:6px;padding:8px 12px;min-height:58px;max-width:1120px;margin:0 auto}
.hdrTitle{font-family:var(--serif);font-size:20px;letter-spacing:.2px;flex:1;min-width:0;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;
cursor:pointer;flex:0 0 auto;transition:background .15s var(--ease)}
.ib:hover{background:color-mix(in oklab,var(--line) 28%,transparent)}
.ib:active{background:color-mix(in oklab,var(--line) 46%,transparent)}
.ib svg{width:21px;height:21px;stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.saveBtn{display:flex;align-items:center;gap:7px;height:40px;padding:0 15px;border:0;border-radius:11px;
background:var(--amber);color:#fff;font-size:14.5px;font-weight:500;cursor:pointer;flex:0 0 auto;
white-space:nowrap;box-shadow:0 1px 2px rgba(30,42,50,.16),0 6px 16px rgba(200,122,34,.24);
transition:transform .14s var(--ease),box-shadow .2s var(--ease),opacity .15s}
.saveBtn:hover{box-shadow:0 1px 2px rgba(30,42,50,.16),0 10px 22px rgba(200,122,34,.32)}
.saveBtn:active{transform:scale(.96)}
.saveBtn svg{width:17px;height:17px;stroke:#fff;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.saveBtn.busy{opacity:.5}
.saveBtn.dirty::after{content:"";position:absolute;top:-3px;right:-3px;width:11px;height:11px;
border-radius:50%;background:#B4472C;border:2px solid var(--bg);animation:pulseDot 1.8s var(--ease) infinite}
.saveBtn{position:relative}
@keyframes pulseDot{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.warnBar{background:var(--amberLt);color:#8A5311;font-size:12.5px;padding:7px 16px;text-align:center;
border-bottom:1px solid color-mix(in oklab,var(--amber) 28%,transparent)}
html[data-theme="dark"] .warnBar{color:#E8C08A}
@media (max-width:600px){
  #syncTxt{display:none}
  .saveBtn span{display:none}
  .saveBtn{padding:0 12px}
  .hdrIn{gap:4px}
}
/* аватарка выбранного участника — всегда в шапке, тап открывает выбор «кто заполняет» */
.meBtn{width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;
cursor:pointer;flex:0 0 auto;padding:0;transition:background .15s var(--ease)}
.meBtn:hover{background:color-mix(in oklab,var(--line) 28%,transparent)}
.meBtn .av{width:28px;height:28px;border-radius:8px;background-size:cover;background-position:50% 50%;
display:grid;place-items:center;font-family:var(--serif);font-size:13px;color:#fff;
box-shadow:0 0 0 1.5px color-mix(in oklab,var(--line) 60%,transparent)}
.meBtn.none .av{background:transparent;box-shadow:0 0 0 1.5px var(--line)}
.meBtn.none .av svg{width:18px;height:18px;stroke:var(--muted);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* полоска контекста: где ты сейчас находишься. Появляется, как только шапка отрывается от начала */
.ctxBar{display:none;max-width:1120px;margin:0 auto;padding:0 12px 8px;align-items:center;gap:8px}
.ctxBar.on{display:flex}
/* это индикатор «где я», а не кнопка: переход по разделам делает нижнее меню */
.ctxBar>span{display:flex;align-items:center;gap:8px;min-height:30px;padding:4px 11px;border-radius:9px;
border:1px solid color-mix(in oklab,var(--line) 50%,transparent);background:var(--card);
font-size:12px;color:var(--muted);max-width:100%;min-width:0}
.ctxBar b{font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ctxBar i{font-style:normal;color:var(--amber);flex:0 0 auto}
.ctxBar svg{width:13px;height:13px;stroke:var(--muted);stroke-width:1.8;fill:none;stroke-linecap:round;
flex:0 0 auto;transform:rotate(180deg)}
.searchWrap{display:none;padding:0 12px 10px;max-width:1120px;margin:0 auto}
.searchWrap.on{display:block}
.searchWrap input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);
background:var(--card);padding:0 14px}
.searchWrap input:focus{outline:none;border-color:var(--amber)}
/* подсказки поиска: список найденных позиций, тап — переход к строке в её разделе */
.sugg{margin-top:8px;background:var(--card);border-radius:12px;box-shadow:var(--shadow);
overflow:hidden;max-height:46vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sgI{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;border:0;
background:transparent;padding:10px 14px;min-height:52px;cursor:pointer;text-align:left;color:var(--ink);
border-bottom:1px solid color-mix(in oklab,var(--line) 30%,transparent);font-family:inherit}
.sgI:last-child{border-bottom:0}
.sgI:hover{background:color-mix(in oklab,var(--zebra) 60%,transparent)}
.sgI b{font-weight:500;font-size:14.5px;line-height:1.3}
.sgI u{text-decoration:none;font-size:11.5px;color:var(--muted);line-height:1.3}
.sgI mark{background:color-mix(in oklab,var(--amber) 30%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.sgEmpty{padding:16px 14px;color:var(--muted);font-size:13px;text-wrap:pretty}
@keyframes hitFlash{0%,55%{box-shadow:inset 0 0 0 2px var(--amber)}100%{box-shadow:inset 0 0 0 2px transparent}}
.row.hit .rowIn,.tlI.hit,.grp.hit{animation:hitFlash 2.2s var(--ease);border-radius:10px}

main{flex:1;max-width:1120px;width:100%;margin:0 auto;
  padding:18px max(16px,env(safe-area-inset-left)) 140px max(16px,env(safe-area-inset-right))}
.view{animation:slidein .28s var(--ease) both}
@keyframes slidein{from{opacity:0;transform:translateX(var(--dir,14px))}to{opacity:1;transform:none}}
/* появление разделов анимируется один раз при загрузке; при обычных перерисовках
   (любая правка зовёт render) повторный въезд всей страницы только дёргает глаз */
body.settled .view{animation:none}

/* ── nav ───────────────────────────────── */
body.inapp .nav{padding-bottom:calc(env(safe-area-inset-bottom) + 52px)}
body.inapp .stick{bottom:calc(111px + env(safe-area-inset-bottom))}
body.inapp .toasts{bottom:calc(124px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--head);
-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
border-top:1px solid color-mix(in oklab,var(--line) 42%,transparent);
padding-bottom:env(safe-area-inset-bottom);
transition:transform .28s var(--ease);will-change:transform}
.nav.hid{transform:none}
@media (min-width:920px){.nav.hid{transform:none}}
.navIn{position:relative;display:flex;max-width:1120px;margin:0 auto}
.navIn>button{flex:1;min-height:58px;border:0;background:transparent;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:7px 0 9px;color:var(--muted);
transition:color .2s var(--ease)}
.navIn>button svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;
transition:transform .25s var(--ease)}
.navIn>button span{font-size:10.5px;letter-spacing:.1px}
.navIn>button.on{color:var(--amber)}
.navIn>button.on svg{transform:translateY(-1px) scale(1.06)}
.navBar{position:absolute;top:0;left:0;height:2px;background:var(--amber);border-radius:2px;
transition:transform .3s var(--ease),width .3s var(--ease)}
/* бренд PackFlow: на телефоне скрыт, в левом меню занимает верхние 80 px */
.brand{display:none}
@media (min-width:920px){
  .brand{position:absolute;top:0;left:0;right:0;height:80px;display:flex;align-items:center;
    gap:11px;padding:0 20px}
  .brand svg{width:37px;height:37px;flex:0 0 auto;border-radius:50%;
    box-shadow:0 0 0 1px color-mix(in oklab,var(--line) 60%,transparent)}
  .brand span{font-family:var(--serif);font-size:18px;letter-spacing:.02em;color:var(--ink)}
}

/* ── общие блоки ───────────────────────── */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.sec{margin-bottom:26px}
.secTtl{font-family:var(--serif);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;
color:var(--muted);margin:0 2px 11px;display:flex;align-items:center;gap:10px}
.secTtl b{font-weight:400;color:var(--ink)}
.secTtl i{flex:1;height:1px;background:color-mix(in oklab,var(--line) 55%,transparent)}
.hint{color:var(--muted);font-size:12.5px;margin:11px 2px 0;text-wrap:pretty}

/* ── ГЛАВНАЯ ───────────────────────────── */
.heroPic{position:relative;border-radius:var(--r);overflow:hidden;background-size:cover;background-position:50% 62%;
min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;box-shadow:var(--shadowUp)}
.heroPic::after{content:"";position:absolute;inset:0;
background:linear-gradient(to top,rgba(12,18,22,.9) 0%,rgba(12,18,22,.44) 44%,rgba(12,18,22,.06) 100%)}
.heroTxt{position:relative;z-index:1;color:#F7F1E6}
.heroTxt h1{font-size:36px;letter-spacing:.045em;line-height:1.04;animation:up14 .6s var(--ease) both}
.heroSub{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:#E5C99E;margin-top:9px;
animation:up14 .6s .06s var(--ease) both}
.heroDates{font-family:var(--serif);font-size:15px;margin-top:3px;color:#DDD4C5;animation:up14 .6s .12s var(--ease) both}
@keyframes up14{from{opacity:0;transform:translateY(14px)}}
.cd{position:relative;z-index:1;display:flex;align-items:baseline;gap:9px;margin-top:18px;
padding-top:15px;border-top:1px solid rgba(247,241,230,.2);color:#F7F1E6;animation:up14 .6s .18s var(--ease) both}
.cdN{font-family:var(--serif);font-size:32px;line-height:1}
.cdL{font-size:12.5px;color:#CFC6B7;flex:1}

.ringRow{display:flex;align-items:center;gap:20px;padding:20px}
.ring{position:relative;width:96px;height:96px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .bg{stroke:color-mix(in oklab,var(--line) 58%,transparent)}
.ring .fg{stroke:var(--amber);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease)}
.ringPct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:23px}
.ringTxt strong{display:block;font-family:var(--serif);font-weight:400;font-size:18px;margin-bottom:4px}
.ringTxt span{font-size:13px;color:var(--muted);text-wrap:pretty}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:15px;border:0;
text-align:left;cursor:pointer;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;
gap:8px;transition:transform .16s var(--ease),box-shadow .2s var(--ease)}
.tile:hover{box-shadow:var(--shadowUp)}
.tile:active{transform:scale(.98)}
.tile em{font-style:normal;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);text-wrap:pretty}
.tile b{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:.01em}
.tile.acc{background:var(--amberLt)}
html[data-theme="dark"] .tile.acc b{color:#F0C68C}

.wRow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wCell{background:var(--card);border-radius:13px;box-shadow:var(--shadow);padding:11px 4px;
text-align:center;min-width:0;transition:transform .2s var(--ease)}
.wCell:hover{transform:translateY(-2px)}
.wCell i{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.wCell svg{width:21px;height:21px;margin:6px auto 4px;display:block;stroke:var(--amber);stroke-width:1.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.wCell b{font-family:var(--serif);font-weight:400;font-size:16px;display:block}
.wCell u{display:block;text-decoration:none;font-size:11px;color:var(--muted)}

/* погода на сегодня — отдельной карточкой, чтобы не путалась с прогнозом на дни поездки */
.wxNow{padding:16px;display:flex;flex-direction:column;gap:10px}
.wxNowTop{display:flex;align-items:center;gap:13px}
.wxNowTop>svg{width:38px;height:38px;stroke:var(--amber);stroke-width:1.4;fill:none;
stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.wxT{font-family:var(--serif);font-size:31px;line-height:1;flex:0 0 auto}
.wxD{flex:1;min-width:0}
.wxD b{display:block;font-weight:500;font-size:14px;text-wrap:pretty}
.wxD small{display:block;color:var(--muted);font-size:12px;margin-top:2px;text-wrap:pretty}
.wxFoot{font-size:11.5px;color:var(--muted);text-wrap:pretty}
button.wCell{border:0;font:inherit;cursor:pointer;color:var(--ink);width:100%;display:block}
.wCell.trip{box-shadow:var(--shadow),inset 0 0 0 1.5px color-mix(in oklab,var(--amber) 55%,transparent)}
.crew{display:grid;grid-template-columns:1fr;gap:12px}
.crewC{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
padding:16px 12px 14px;text-align:center;min-width:0;transition:transform .18s var(--ease),box-shadow .22s var(--ease)}
.crewC:hover{box-shadow:var(--shadowUp)}
.avaWrap{position:relative;width:88px;height:88px;margin:0 auto 11px;cursor:pointer}
.avaWrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ava{position:absolute;inset:6px;border-radius:12px;display:grid;place-items:center;overflow:hidden;
font-family:var(--serif);font-size:27px;color:#fff;background-size:cover;background-position:50% 50%;
box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.avaCam{position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;
background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;pointer-events:none;
opacity:0;transform:scale(.8);transition:opacity .2s var(--ease),transform .2s var(--ease)}
.avaWrap:hover .avaCam,.crewC.noph .avaCam{opacity:1;transform:none}
.avaCam svg{position:static;transform:none;width:15px;height:15px;stroke:var(--muted);stroke-width:1.6;fill:none}
.crewName{font-family:var(--serif);font-size:17px;padding:2px 7px;border-radius:7px;display:inline-block;min-width:44px;white-space:nowrap}
.crewName:focus{outline:1.5px solid var(--amber);outline-offset:1px}
.crewRole{font-size:11.5px;color:var(--muted);margin-top:3px;text-wrap:pretty}
.crewStat{margin-top:9px;font-size:12px;color:var(--muted)}
.crewBar{height:3px;border-radius:3px;background:color-mix(in oklab,var(--line) 55%,transparent);margin-top:7px;overflow:hidden}
.crewBar i{display:block;height:100%;border-radius:3px;transition:width .4s var(--ease)}
.crewX{position:absolute;top:6px;right:6px;width:30px;height:30px;border:0;background:transparent;border-radius:50%;
cursor:pointer;display:grid;place-items:center;opacity:0;transition:opacity .2s var(--ease)}
.crewC:hover .crewX{opacity:.65}
.crewX:hover{opacity:1!important;background:color-mix(in oklab,var(--line) 35%,transparent)}
.crewX svg{width:14px;height:14px;stroke:var(--muted);stroke-width:1.8;fill:none;stroke-linecap:round}
.crewAdd{border:1.5px dashed color-mix(in oklab,var(--line) 85%,transparent);background:transparent;
border-radius:var(--r);min-height:264px;cursor:pointer;display:flex;flex-direction:column;align-items:center;
justify-content:center;gap:8px;color:var(--muted);font-size:13.5px;transition:border-color .2s,color .2s}
.crewAdd:hover{border-color:var(--amber);color:var(--amber)}
.crewAdd svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round}

/* ── легенда ───────────────────────────── */
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:14px}
.lg{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);min-width:0;white-space:nowrap}
.lgD{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;flex:0 0 auto}
.lgD svg{width:14px;height:14px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lgD.s1{border-color:var(--amber)} .lgD.s1 svg{stroke:var(--amber)}
.lgD.s2{border-color:var(--pine);background:var(--pine)} .lgD.s2 svg{stroke:#fff}
.lgD.s3{border-color:var(--water);background:var(--water)} .lgD.s3 svg{stroke:#fff}
.lgD.sq{border-color:#A8442E} .lgD.sq svg{stroke:#A8442E}
html[data-theme="dark"] .lgD.s2 svg,html[data-theme="dark"] .lgD.s3 svg{stroke:#0E1F1A}
html[data-theme="dark"] .lgD.sq{border-color:#E9A288} html[data-theme="dark"] .lgD.sq svg{stroke:#E9A288}

/* ── группы и строки ───────────────────── */
.grp{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.grpH{display:flex;align-items:center;gap:11px;padding:14px;cursor:pointer;user-select:none;
background:transparent;border:0;width:100%;text-align:left;min-height:58px;transition:background .15s}
.grpH:hover{background:color-mix(in oklab,var(--zebra) 60%,transparent)}
.grpCnt{font-family:var(--serif);font-size:14.5px;color:var(--muted);flex:0 0 auto;min-width:54px}
.grpName{flex:1;font-size:15px;font-weight:500;letter-spacing:.01em;min-width:0}
.grpBar{height:3px;border-radius:3px;background:color-mix(in oklab,var(--line) 55%,transparent);
width:56px;flex:0 0 auto;overflow:hidden}
.grpBar i{display:block;height:100%;background:var(--pine);border-radius:3px;transition:width .35s var(--ease)}
.chev{width:18px;height:18px;stroke:var(--muted);stroke-width:1.6;fill:none;stroke-linecap:round;
transition:transform .3s var(--ease);flex:0 0 auto}
.grp.closed .chev{transform:rotate(-90deg)}
.grpBody{border-top:1px solid color-mix(in oklab,var(--line) 38%,transparent);
overflow:hidden;transition:max-height .34s var(--ease),opacity .26s var(--ease)}
.grp.closed .grpBody{max-height:0!important;opacity:0;border-top-color:transparent}

.row{position:relative;overflow:hidden;border-bottom:1px solid color-mix(in oklab,var(--line) 30%,transparent);
animation:rowin .32s var(--ease) both;animation-delay:var(--d,0ms)}
@keyframes rowin{from{opacity:0;transform:translateY(6px)}}
.row:last-of-type{border-bottom:0}
.rowDel{position:absolute;inset:0 0 0 auto;width:112px;background:#A8442E;color:#fff;display:flex;
align-items:center;justify-content:center;font-size:13.5px}
.rowIn{position:relative;background:var(--card);padding:11px 12px;transition:transform .26s var(--ease)}
.row.sw .rowIn{transition:none}
.rowTop{display:flex;align-items:flex-start;gap:11px}
.rowName{flex:1;min-width:0;font-size:15px;padding:3px 3px;border-radius:7px;line-height:1.32;
transition:opacity .25s var(--ease);word-break:break-word;text-wrap:pretty}
.rowName:hover{background:color-mix(in oklab,var(--zebra) 55%,transparent)}
.rowName:focus{outline:1.5px solid var(--amber);outline-offset:1px;background:var(--bg)}
.rowNote{font-size:12.5px;color:var(--muted);margin-top:2px;text-wrap:pretty}
.rowBot{display:flex;align-items:center;gap:7px;padding-left:40px;margin-top:7px;flex-wrap:wrap}
.done .rowName{opacity:.5}
.strike{position:relative}
.strike::after{content:"";position:absolute;left:0;top:53%;height:1px;background:currentColor;
width:0;transition:width .28s var(--ease)}
.done .strike::after{width:100%}
.stLbl{font-size:11.5px;letter-spacing:.03em;margin-top:5px;display:inline-flex;align-items:center;gap:6px;
border:0;background:transparent;padding:3px 0;color:var(--muted);cursor:pointer;font-family:inherit;text-align:left}
.stLbl::before{content:"";width:7px;height:7px;border-radius:2px;background:currentColor;opacity:.6;flex:0 0 auto}
.stLbl[data-s="1"]{color:var(--amber)}
.stLbl[data-s="2"]{color:var(--pine)}
html[data-theme="dark"] .stLbl[data-s="2"]{color:#8FC0A6}
.stLbl[data-s="3"]{color:var(--water)}
html[data-theme="dark"] .stLbl[data-s="3"]{color:#8FB6CE}
.stLbl[data-s="q"]{color:#A8442E}
html[data-theme="dark"] .stLbl[data-s="q"]{color:#E9A288}

.chk{position:relative;width:30px;height:30px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line);
background:transparent;padding:0;cursor:pointer;display:grid;place-items:center;margin:0;
transition:background .25s var(--ease),border-color .25s var(--ease),transform .14s var(--ease)}
.chk:hover{border-color:var(--amber)}
.chk.pop{animation:pop .16s var(--ease)}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.chk svg{width:17px;height:17px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chk svg path,.chk svg polyline{stroke-dasharray:30;stroke-dashoffset:30;transition:stroke-dashoffset .26s var(--ease)}
.chk.mark svg path,.chk.mark svg polyline{stroke-dashoffset:0}
.chk[data-s="1"]{border-color:var(--amber)} .chk[data-s="1"] svg{stroke:var(--amber)}
.chk[data-s="2"]{border-color:var(--pine);background:var(--pine)} .chk[data-s="2"] svg{stroke:#fff}
.chk[data-s="3"]{border-color:var(--water);background:var(--water)} .chk[data-s="3"] svg{stroke:#fff}
html[data-theme="dark"] .chk[data-s="2"] svg,html[data-theme="dark"] .chk[data-s="3"] svg{stroke:#0E1F1A}

.stp{display:flex;align-items:center;background:var(--bg);border-radius:10px;overflow:hidden;flex:0 0 auto;
border:1px solid color-mix(in oklab,var(--line) 52%,transparent)}
.stp button{width:40px;height:38px;border:0;background:transparent;cursor:pointer;color:var(--muted);
display:grid;place-items:center;transition:background .15s}
.stp button:hover{background:color-mix(in oklab,var(--line) 30%,transparent)}
.stp button svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round}
.stp input{width:42px;height:38px;border:0;background:transparent;text-align:center;font-size:14px}
.stp input:focus{outline:none;background:var(--amberLt)}
.stpU{font-size:12px;color:var(--muted);padding-right:10px}

.pchip{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 11px 0 9px;border-radius:10px;
border:1px solid color-mix(in oklab,var(--line) 58%,transparent);background:transparent;cursor:pointer;
font-size:13px;color:var(--muted);transition:background .2s var(--ease),border-color .2s var(--ease),transform .14s var(--ease)}
.pchip:hover{border-color:var(--amber)}
.pchip.pop{animation:pop .16s var(--ease)}
.pchip .av{width:22px;height:22px;border-radius:6px;flex:0 0 auto;display:grid;place-items:center;
background-size:cover;background-position:50% 50%;font-family:var(--serif);font-size:11px;color:#fff}
.pchip b{font-weight:500;color:var(--ink);font-family:var(--serif);font-size:14px}
.pchip .gl{width:15px;height:15px;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke:var(--line)}
.pchip[data-s="1"]{border-color:var(--amber);background:color-mix(in oklab,var(--amber) 9%,transparent)}
.pchip[data-s="1"] .gl{stroke:var(--amber)}
.pchip[data-s="2"]{border-color:transparent;background:color-mix(in oklab,var(--pine) 17%,transparent)}
.pchip[data-s="2"] .gl{stroke:var(--pine)}
.pchip[data-s="2"] b{color:var(--pine)}
html[data-theme="dark"] .pchip[data-s="2"] b,html[data-theme="dark"] .pchip[data-s="2"] .gl{color:#8FC0A6;stroke:#8FC0A6}
.pchip[data-s="3"]{border-color:transparent;background:color-mix(in oklab,var(--water) 16%,transparent)}
.pchip[data-s="3"] .gl{stroke:var(--water)}
.pchip[data-s="4"] b{color:var(--water)}
.pchip.sel{border-color:var(--amber);background:color-mix(in oklab,var(--amber) 12%,transparent)}
.pchip.base{font-size:12.5px}
.newDot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);
vertical-align:middle;margin-left:6px}
.trashB{width:38px;height:38px;border:0;background:transparent;border-radius:10px;cursor:pointer;
display:grid;place-items:center;flex:0 0 auto;margin-left:auto;opacity:.5;transition:opacity .2s,background .2s}
.trashB:hover{opacity:1;background:color-mix(in oklab,#A8442E 12%,transparent)}
.trashB svg{width:16px;height:16px;stroke:#A8442E;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.totMini{font-family:var(--serif);color:var(--muted);font-size:13px;padding:0 4px;white-space:nowrap}

/* добавление */
.addRow{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;
padding:14px;min-height:54px;cursor:pointer;color:var(--muted);font-size:14.5px;text-align:left;
border-top:1px solid color-mix(in oklab,var(--line) 30%,transparent);transition:color .18s,background .18s}
.addRow:hover{color:var(--amber);background:color-mix(in oklab,var(--zebra) 55%,transparent)}
.addRow svg{width:17px;height:17px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;flex:0 0 auto}
.addForm{border-top:1px solid color-mix(in oklab,var(--line) 30%,transparent);padding:12px 14px 14px;
background:color-mix(in oklab,var(--amberLt) 40%,transparent);animation:rowin .26s var(--ease) both}
.addForm input.nm{width:100%;height:42px;border:0;border-bottom:1.5px solid var(--amber);background:transparent;
font-size:15.5px;padding:0 2px}
.addForm input.nm:focus{outline:none}
.addForm .lbl{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:13px 0 7px}
.addForm .rowA{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.addForm .go{height:40px;padding:0 16px;border-radius:10px;border:0;background:var(--amber);color:#fff;
font-size:14.5px;cursor:pointer;margin-left:auto}
.addForm .cn{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:transparent;
font-size:14px;cursor:pointer;color:var(--muted)}

/* переключатель участников */
.who{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.who button{flex:1 1 0;min-width:62px;min-height:52px;border-radius:12px;
border:1px solid color-mix(in oklab,var(--line) 55%,transparent);
background:var(--card);cursor:pointer;font-size:13px;padding:5px 3px;display:flex;flex-direction:column;
align-items:center;justify-content:center;gap:3px;transition:background .2s var(--ease),transform .16s var(--ease),box-shadow .2s}
.who button:hover{box-shadow:var(--shadow)}
.who button u{text-decoration:none;font-size:10.5px;color:var(--muted)}
.who button .av{width:22px;height:22px;border-radius:6px;background-size:cover;background-position:50% 50%;
display:grid;place-items:center;font-family:var(--serif);font-size:11px;color:#fff}
.who button.on{background:var(--night);color:#F7F1E6;border-color:var(--night)}
.who button.on u{color:#C9BEAB}
html[data-theme="dark"] .who button.on{background:#F0E8DA;color:#16222A;border-color:#F0E8DA}
html[data-theme="dark"] .who button.on u{color:#5B6B75}

/* ── ЗАКУПКА ───────────────────────────── */
.money{font-family:var(--serif);font-size:16.5px;flex:0 0 auto;min-width:78px;text-align:right}
.money.zero{color:var(--muted)}
.money.roll{animation:roll .42s var(--ease)}
@keyframes roll{0%{transform:translateY(-32%);opacity:.3}100%{transform:none;opacity:1}}
.numIn{width:60px;height:38px;border:0;border-bottom:1.5px dashed var(--amber);background:transparent;
text-align:center;font-size:14px;border-radius:0}
.numIn:focus{outline:none;background:var(--amberLt)}
.selSt{height:38px;border-radius:10px;border:1px solid color-mix(in oklab,var(--line) 58%,transparent);
background:var(--bg);padding:0 9px;font-size:13px;max-width:158px;-webkit-appearance:none;appearance:none;cursor:pointer}
.selSt:focus{outline:none;border-color:var(--amber)}
.selSt.skip{color:var(--muted)}
.subTot{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
background:var(--amberLt);font-size:13px;gap:10px}
.subTot b{font-family:var(--serif);font-size:16.5px;font-weight:400}
html[data-theme="dark"] .subTot b{color:#F0C68C}
.subTot.pers{background:color-mix(in oklab,var(--line) 24%,transparent)}
html[data-theme="dark"] .subTot.pers b{color:var(--ink)}
.stick{position:fixed;left:0;right:0;bottom:calc(59px + env(safe-area-inset-bottom));z-index:38;
background:var(--head);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
border-top:1px solid color-mix(in oklab,var(--line) 42%,transparent);padding:10px 16px}
.stickIn{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px}
.stickIn .money{font-size:20px;min-width:0}
.stickIn em{font-style:normal;font-size:11.5px;color:var(--muted);flex:1;line-height:1.35}
.shopBtn{height:40px;padding:0 14px;border-radius:11px;border:1px solid var(--amber);color:var(--amber);
background:transparent;font-size:13.5px;cursor:pointer;flex:0 0 auto;white-space:nowrap;transition:background .2s}
.shopBtn:hover{background:color-mix(in oklab,var(--amber) 10%,transparent)}
/* строка позиции в закупке собрана из трёх понятных полос, каждая переносится целиком:
   числа · статус и корзина · кто покупает. Раньше «план» и «факт» разъезжались по разным строкам */
.buyNums{display:flex;align-items:flex-end;gap:6px;flex-wrap:nowrap;min-width:0}
.buyNums .numIn{width:54px}
.buyNums .unIn{width:48px}
.buyNums .mul{color:var(--muted);align-self:center;flex:0 0 auto}
.buyMeta{display:flex;align-items:center;gap:8px;flex:1 1 232px;min-width:0}
.buyMeta .selSt{flex:1 1 auto;min-width:0;max-width:220px}
.buyMeta .trashB{margin-left:0}
.buyWho{display:flex;align-items:center;gap:8px;width:100%;padding-left:40px;margin-top:8px}
.buyWho>span{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;flex:0 0 auto}
.buyWho .pchip{min-height:44px;height:auto;flex:1 1 auto;justify-content:flex-start;min-width:0}
.buyWho .pchip b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.buyWho .pchip.none b{color:var(--muted);font-family:var(--sans);font-size:13px}
/* в «Сборах» нижняя полоса тоже делится на осмысленные строки, а не переносится как придётся */
.gearLine{display:flex;align-items:center;gap:7px;flex:1 1 100%;min-width:0;flex-wrap:wrap}
.gearOwn{display:flex;align-items:center;gap:7px;flex:1 1 100%;min-width:0;flex-wrap:wrap}
.gearOwn .pchip{gap:5px;padding:0 9px 0 7px}
.gearOwn .pchip b{font-family:var(--serif);font-size:14px}
.gearOwn .pchip span.qty{font-size:12px;color:var(--muted)}

/* режим магазина */
.shop{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;
animation:fadein .25s var(--ease) both}
@keyframes fadein{from{opacity:0}}
.shopH{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.shopH h2{flex:1;font-size:20px}
.shopL{flex:1;overflow-y:auto;padding-bottom:40px}
.shopI{display:flex;align-items:center;gap:14px;padding:18px;border-bottom:1px solid color-mix(in oklab,var(--line) 36%,transparent);cursor:pointer}
.shopI span{flex:1;font-size:19px;line-height:1.25}
.shopI em{font-style:normal;font-family:var(--serif);font-size:17px;color:var(--muted)}
.shopI.done span{opacity:.4;text-decoration:line-through}

/* ── ЛОГИСТИКА ─────────────────────────── */
.pRow{display:flex;align-items:center;gap:10px;padding:12px 14px;
border-bottom:1px solid color-mix(in oklab,var(--line) 30%,transparent)}
.pRow:last-child{border-bottom:0}
.pRow div{flex:1;min-width:0}
.pRow em{font-style:normal;font-size:14.5px;display:block;text-wrap:pretty}
.pRow small{color:var(--muted);font-size:12px;display:block;margin-top:2px;text-wrap:pretty}
.pRow .numIn{width:78px;font-size:15px}
.pRow u{text-decoration:none;color:var(--muted);font-size:12px;min-width:46px}
.cRow{display:flex;align-items:baseline;gap:10px;padding:12px 14px;
border-bottom:1px solid color-mix(in oklab,var(--line) 30%,transparent)}
.cRow div{flex:1;min-width:0}
.cRow em{font-style:normal;font-size:14.5px;display:block;text-wrap:pretty}
.cRow small{color:var(--muted);font-size:12px;display:block;margin-top:2px;text-wrap:pretty}
.totRow{display:flex;justify-content:space-between;align-items:center;padding:14px;background:var(--amberLt);gap:10px}
.totRow em{font-style:normal;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.totRow b{font-family:var(--serif);font-weight:400;font-size:22px}
html[data-theme="dark"] .totRow b{color:#F0C68C}
.warnBox{display:flex;gap:10px;padding:13px 14px;background:var(--amberLt);font-size:13px;
align-items:flex-start;text-wrap:pretty}
.warnBox svg{width:18px;height:18px;flex:0 0 auto;stroke:var(--amber);stroke-width:1.6;fill:none;margin-top:1px}
.tl{padding:6px 0}
.tlI{display:flex;gap:12px;padding:11px 14px;position:relative}
.tlI::before{content:"";position:absolute;left:27px;top:0;bottom:0;width:1px;
background:color-mix(in oklab,var(--line) 58%,transparent)}
.tlI:first-child::before{top:24px}
.tlI:last-child::before{bottom:calc(100% - 24px)}
.tlD{width:28px;height:28px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--line);
background:var(--card);z-index:1;display:grid;place-items:center;cursor:pointer;padding:0;
transition:background .26s var(--ease),border-color .26s var(--ease)}
.tlD svg{width:15px;height:15px;stroke:transparent;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tlD.on{background:var(--pine);border-color:var(--pine)}
.tlD.on svg{stroke:#fff}
.tlB{flex:1;min-width:0;padding-bottom:4px}
.tlB .tmIn{width:66px;border:0;border-bottom:1.5px dashed var(--amber);background:transparent;
font-family:var(--serif);font-size:16px;padding:1px 0}
.tlB .tmIn:focus{outline:none;background:var(--amberLt)}
.tlB em{font-style:normal;display:block;font-size:14.5px;margin-top:3px;text-wrap:pretty}
.tlB small{display:block;color:var(--muted);font-size:12.5px;margin-top:3px;text-wrap:pretty}
.tlI.on .tlB em{opacity:.5}

/* ── МЕНЮ ──────────────────────────────── */
.dish{display:flex;gap:10px;padding:10px 14px;align-items:flex-start;
border-top:1px solid color-mix(in oklab,var(--line) 26%,transparent);font-size:14px}
.dish .dn{flex:1;padding:3px;border-radius:7px;text-wrap:pretty}
.dish .dq{flex:0 0 40%;padding:3px;border-radius:7px;color:var(--muted);font-size:12.5px;text-wrap:pretty}
.dish .dn:hover,.dish .dq:hover{background:color-mix(in oklab,var(--zebra) 55%,transparent)}
.dish .dn:focus,.dish .dq:focus{outline:1.5px solid var(--amber);outline-offset:1px;background:var(--bg)}
.dish .trashB{margin-left:0;width:32px;height:32px}

/* ── тосты, шторки ─────────────────────── */
.toasts{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));z-index:80;
display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--night);color:#F7F1E6;border-radius:13px;padding:13px 15px;font-size:13.5px;
box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;align-items:center;gap:14px;max-width:540px;
pointer-events:auto;animation:tin .28s var(--ease) both;text-wrap:pretty}
html[data-theme="dark"] .toast{background:#F0E8DA;color:#16222A}
.toast.out{animation:tout .25s var(--ease) both}
@keyframes tin{from{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes tout{to{opacity:0;transform:translateY(10px)}}
.toast button{border:0;background:transparent;color:#E8A44A;font-size:13.5px;cursor:pointer;padding:6px 2px;flex:0 0 auto}
html[data-theme="dark"] .toast button{color:#9A5A11}
.sheet{position:fixed;inset:0;z-index:90;display:flex;align-items:flex-end;justify-content:center}
.sheetBg{position:absolute;inset:0;background:rgba(12,18,22,.46);animation:fadein .22s var(--ease) both;
-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheetC{position:relative;background:var(--card);width:100%;max-width:540px;border-radius:18px 18px 0 0;
padding:8px 0 max(12px,env(safe-area-inset-bottom));animation:up .3s var(--ease) both;
box-shadow:0 -10px 40px rgba(0,0,0,.2);max-height:92vh;max-height:92svh;overflow-y:auto}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.sheetC h3{padding:14px 22px 6px;font-size:19px}
.sheetC p{margin:0;padding:0 22px 13px;font-size:13.5px;color:var(--muted);text-wrap:pretty}
.mItem{display:flex;align-items:center;gap:13px;width:100%;border:0;background:transparent;
padding:15px 22px;min-height:54px;font-size:15px;cursor:pointer;text-align:left;color:var(--ink);transition:background .15s}
.mItem:hover{background:color-mix(in oklab,var(--zebra) 60%,transparent)}
.mItem svg{width:19px;height:19px;stroke:var(--muted);stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.mItem u{text-decoration:none;margin-left:auto;color:var(--muted);font-size:13px}
.mItem.dang{color:#A8442E} .mItem.dang svg{stroke:#A8442E}
.rights{padding:0 22px 10px;display:grid;gap:8px}
.rt{display:flex;align-items:flex-start;gap:9px;font-size:13px;color:var(--muted);line-height:1.35}
.rt svg{width:15px;height:15px;flex:0 0 auto;margin-top:2px;stroke:var(--pine);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}

var TRL={'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'y','к':'k',
 'л':'l','м':'m','н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'h','ц':'c','ч':'ch',
 'ш':'sh','щ':'sch','ъ':'','ы':'y','ь':'','э':'e','ю':'yu','я':'ya'};
function slugOf(name){
  var s=String(name||'').trim().toLowerCase(), out='', i, c;
  for(i=0;i<s.length;i++){
    c=s.charAt(i);
    if(TRL[c]!=null)out+=TRL[c];
    else if(c>='a'&&c<='z')out+=c;
    else if(c>='0'&&c<='9')out+=c;
    else if(c===' '||c==='-')out+='-';
  }
  out=out.replace(/-+/g,'-').replace(/^-+|-+$/g,'');
  return out?out.charAt(0).toUpperCase()+out.slice(1):'Uchastnik';
}
function newKey(){
  var a='abcdefghijkmnpqrstuvwxyz23456789', s='', i;
  for(i=0;i<8;i++)s+=a.charAt(Math.floor(Math.random()*a.length));
  return s;
}
/* встроенные браузеры мессенджеров рисуют свою панель поверх страницы — нижнему меню нужен запас */
function inAppBrowser(){
  var ua=navigator.userAgent||'';
  if(/Telegram|FBAN|FBAV|Instagram|Line\/|VKClient|OKApp|MiuiBrowser/i.test(ua))return true;
  return /iPhone|iPad|iPod/.test(ua)&&!/Safari/.test(ua)&&!window.navigator.standalone;
}
function normalize(st){
  st.ui=st.ui||{}; if(!st.ui.tab)st.ui.tab='home'; st.ui.open=st.ui.open||{};
  st.del=st.del||{};
  if(!st.stVer){                          /* состояний было пять, «есть дома» убрали */
    var STMAP=[0,1,1,2,3];
    (st.gear||[]).forEach(function(g){
      var s=g.s||{},k;
      for(k in s)if(Object.prototype.hasOwnProperty.call(s,k))s[k]=STMAP[s[k]||0]||0;
    });
    st.stVer=2;
  }
  st.gear.forEach(function(g){g.s=g.s||{};g.o=g.o||{};g.ua=g.ua||0;});
  st.buy.forEach(function(p){p.b=!!p.b;p.ua=p.ua||0;if(p.who==null)p.who='';});
  st.route.forEach(function(r){r.ua=r.ua||0;});
  st.ideas.forEach(function(q){q.ua=q.ua||0;});
  st.buySections.forEach(function(s){s.personal=!!s.personal;});
  var slugs={};
  st.people.forEach(function(p){
    if(p.photo==null)p.photo='';if(!p.perm)p.perm='member';p.ua=p.ua||0;
    /* ссылка и ключ прав должны совпадать во всех копиях документа, поэтому у знакомых
       участников берём их из сида, а случайный ключ выдаём только незнакомым */
    var sd=null;SEED.people.forEach(function(x){if(x.id===p.id)sd=x;});
    var sl=p.slug||(sd&&sd.slug)||slugOf(p.name);
    if(slugs[sl])sl=sl+'-'+p.id;
    slugs[sl]=1;p.slug=sl;
    if(!p.key)p.key=(sd&&sd.key)||newKey();
  });
  st.trip.hero=st.trip.hero||'';
  st.tileLabels=st.tileLabels||['Транспорт, лодка, парковка','Продукты и расходники','Общий бюджет','С каждого'];
  st.secTitles=st.secTitles||{};
  return st;
}
function mergeSeed(old,seed){
  var out=cl(old), added=0;
  ['gear','buy','route','ideas'].forEach(function(k){
    var have={};out[k].forEach(function(x){have[x.i]=1;});
    seed[k].forEach(function(x){if(!have[x.i]){var c=cl(x);c.nw=1;out[k].push(c);added++;}});
  });
  var hp={};out.people.forEach(function(p){hp[p.id]=p;});
  seed.people.forEach(function(p){
    var m=hp[p.id];
    if(!m){out.people.push(cl(p));return;}
    /* ссылки и ключи прав держим одинаковыми у всех копий документа */
    if(!m.slug&&p.slug)m.slug=p.slug;
    if(!m.key&&p.key)m.key=p.key;
  });
  /* из сида добираем только то, чего нет: правки названий, обложки и подписей не трогаем */
  function fill(list,key){
    var out2=out[list]&&out[list].length?out[list]:[];
    var have={};out2.forEach(function(x){have[x[key]]=1;});
    (seed[list]||[]).forEach(function(x){if(!have[x[key]])out2.push(cl(x));});
    out[list]=out2;
  }
  fill('gearSections','id');fill('buySections','id');fill('logNotes','k');
  fill('calcRows','k');fill('canRows','k');
  out.trip=out.trip||{};
  Object.keys(seed.trip).forEach(function(k){if(out.trip[k]===undefined)out.trip[k]=cl(seed.trip[k]);});
  out.weather=out.weather||seed.weather;
  out.menu=out.menu||seed.menu;out.seedAdded=added;
  return out;
}
/* ─── назначенные задачи ───
   Когда кто-то создаёт позицию и вешает её на другого, тому приходит накопительное уведомление
   «Костя добавил тебе 3 задачи». Кто поручил — в поле `as` (у закупки и у снаряжения);
   если его нет, считаем автором позиции `by`. Отметка «что уже видел» лежит в браузере,
   у каждого своя: в общий документ она не идёт, иначе один прочитал — и у всех погасло. */
function markAssigned(item,who){
  if(who&&who!==S.ui.me)item.as=S.ui.me||'';
}
function taskAuthor(item){return item.as||item.by||'';}
function seenKey(){return LSKEY+'.seen.'+(S.ui.me||'guest');}
function seenGet(){try{return +localStorage.getItem(seenKey())||0;}catch(e){return 0;}}
function seenSet(t){try{localStorage.setItem(seenKey(),String(t));}catch(e){}}
function myTasks(){
  var me=S.ui.me, out=[];
  if(!me)return out;
  S.buy.forEach(function(p){
    var a=taskAuthor(p);
    if(p.who===me&&a&&a!==me&&!p.b)out.push({kind:'buy',i:p.i,n:p.n,by:a,ua:p.ua||0,item:p,
      tab:'buy',what:'купить'});
  });
  S.gear.forEach(function(g){
    var a=taskAuthor(g);
    if((g.o[me]||0)>0&&a&&a!==me&&(g.s[me]||0)<ST_OK)out.push({kind:'gear',i:g.i,n:g.n,by:a,ua:g.ua||0,item:g,
      tab:'gear',what:'везти'});
  });
  out.sort(function(x,y){return y.ua-x.ua;});
  return out;
}
function newTasks(){var t=seenGet();return myTasks().filter(function(x){return x.ua>t;});}
/* «Костя добавил тебе 3 задачи» — или «Тебе добавили 4 задачи», если поручали разные люди */
function tasksTitle(list){
  var who={},names=[];
  list.forEach(function(x){if(!who[x.by]){who[x.by]=1;var p=person(x.by);if(p)names.push(p.name);}});
  var n=list.length, tail=n+' '+plural(n,'задачу','задачи','задач');
  return names.length===1?(names[0]+' добавил тебе '+tail):('Тебе добавили '+tail);
}
function tasksSeen(){
  var mx=0;myTasks().forEach(function(x){if(x.ua>mx)mx=x.ua;});
  seenSet(Math.max(mx,Date.now()-1));
}

/* ─── удалённые позиции: помним, что убрали и когда, иначе слияние их воскресит ─── */
function forget(kind,item){S.del=S.del||{};S.del[kind+':'+item.i]=Date.now();}
function revive(kind,item){if(S.del)delete S.del[kind+':'+item.i];}

/* ─── слияние другого экземпляра документа в текущий ───
   Сопоставление по i, побеждает более свежая метка ua. Статусы сборов при равных метках
   берутся более продвинутые. Работает и для офлайн-файла, и для состояния с сервера;
   тосты рисует вызывающий. */
function mergeInto(inc){
  var marks=0,news=0,edits=0,gone=0;
  inc=inc||{};
  S.del=S.del||{};
  var idel=inc.del||{};
  Object.keys(idel).forEach(function(k){if((idel[k]||0)>(S.del[k]||0))S.del[k]=idel[k];});

  var PF=['name','ini','car','role','desc','color','perm','key','slug','photo'];
  (inc.people||[]).forEach(function(ip){
    var mine=null;S.people.forEach(function(p){if(p.id===ip.id)mine=p;});
    if(!mine){
      if((S.del['people:'+ip.id]||0)>=(ip.ua||0))return;
      S.people.push(cl(ip));news++;return;
    }
    if((ip.ua||0)>(mine.ua||0)){
      PF.forEach(function(f){if(ip[f]!=null&&ip[f]!==mine[f]){mine[f]=ip[f];edits++;}});
      mine.ua=ip.ua;
    } else if(!mine.photo&&ip.photo){mine.photo=ip.photo;edits++;}
  });
  for(var pj=S.people.length-1;pj>=0;pj--){
    var pt=S.del['people:'+S.people[pj].id]||0;
    if(pt&&pt>(S.people[pj].ua||0)&&S.people.length>1){S.people.splice(pj,1);gone++;}
  }

  function pick(k,cmp){
    var byId={};S[k].forEach(function(x){byId[x.i]=x;});
    (inc[k]||[]).forEach(function(x){
      var mine=byId[x.i];
      if(!mine){
        if((S.del[k+':'+x.i]||0)>=(x.ua||0))return;
        var c=cl(x);c.nw=1;S[k].push(c);news++;return;
      }
      var r=cmp(mine,x);marks+=r.marks;edits+=r.edits;
    });
    for(var j=S[k].length-1;j>=0;j--){
      var it=S[k][j], t=S.del[k+':'+it.i]||0;
      if(t&&t>(it.ua||0)){S[k].splice(j,1);gone++;}
    }
  }
  function fields(a,b,list){
    var e=0;
    list.forEach(function(f){if(b[f]!==undefined&&b[f]!==a[f]){a[f]=cl(b[f]);e++;}});
    return e;
  }
  pick('gear',function(a,b){
    var m=0,e=0;
    Object.keys(b.s||{}).forEach(function(p){
      var av=(a.s||{})[p]||0, bv=b.s[p]||0;
      var take=(b.ua||0)>(a.ua||0)?bv:Math.max(av,bv);
      if(take!==av){a.s[p]=take;m++;}
    });
    if((b.ua||0)>(a.ua||0)){
      e+=fields(a,b,['n','c','sec','by','as']);
      if(JSON.stringify(b.o)!==JSON.stringify(a.o)){a.o=cl(b.o);e++;}
      if(JSON.stringify(b.q||{})!==JSON.stringify(a.q||{})){a.q=cl(b.q||{});e++;}
      a.ua=b.ua;
    }
    return {marks:m,edits:e};
  });
  pick('buy',function(a,b){
    var m=0,e=0;
    if(!!b.b!==!!a.b){if((b.ua||0)>=(a.ua||0)||b.b){a.b=!!b.b;m++;}}
    if((b.ua||0)>(a.ua||0)){
      e+=fields(a,b,['n','q','pr','prf','st','u','who','sec','c','by','as']);
      a.ua=b.ua;
    }
    return {marks:m,edits:e};
  });
  pick('route',function(a,b){
    var m=0,e=0;
    if(!!b.done!==!!a.done){if((b.ua||0)>=(a.ua||0)||b.done){a.done=!!b.done;m++;}}
    if((b.ua||0)>(a.ua||0)){e+=fields(a,b,['n','time','c']);a.ua=b.ua;}
    return {marks:m,edits:e};
  });
  pick('ideas',function(a,b){
    var m=0,e=0;
    if(!!b.done!==!!a.done){if((b.ua||0)>=(a.ua||0)||b.done){a.done=!!b.done;m++;}}
    if((b.ua||0)>(a.ua||0)){e+=fields(a,b,['n','why','who']);a.ua=b.ua;}
    return {marks:m,edits:e};
  });
  /* общие блоки без отдельных меток времени — по свежести всего документа */
  if((inc.updatedAt||'')>(S.updatedAt||'')){
    ['log','menu','weather','boat','tileLabels','secTitles','logNotes','calcRows','canRows','buySections']
     .forEach(function(f){if(inc[f]){S[f]=cl(inc[f]);}});
    if(inc.trip)S.trip=cl(inc.trip);
    if(inc.theme!==undefined)S.theme=inc.theme;
  }
  return {marks:marks,edits:edits,news:news,gone:gone,total:marks+edits+news+gone};
}
function mergeFile(inc){
  var r=mergeInto(inc);
  var who=(inc.author||'').trim(), parts=[];
  if(r.marks)parts.push(r.marks+' '+plural(r.marks,'отметка','отметки','отметок'));
  if(r.edits)parts.push(r.edits+' '+plural(r.edits,'правка','правки','правок'));
  if(r.news)parts.push(r.news+' '+plural(r.news,'новая позиция','новые позиции','новых позиций'));
  if(r.gone)parts.push(r.gone+' '+plural(r.gone,'позиция убрана','позиции убраны','позиций убрано'));
  touch();render();
  toast(parts.length?('Из файла'+(who?' '+rodit(who):'')+' добавлено: '+parts.join(', ')+'.')
    :'В этом файле нет ничего нового — всё уже отмечено.');
}
function plural(n,a,b,c){var n10=n%10,n100=n%100;
  if(n10===1&&n100!==11)return a; if(n10>=2&&n10<=4&&(n100<10||n100>=20))return b; return c;}
var RODIT={'Макс':'Макса','Костя':'Кости','Миша':'Миши','Женя':'Жени'};
function rodit(n){return RODIT[n]||n;}

/* правки всегда сохраняются сами: в браузере — сразу, на сервере — через секунду.
   Кнопка файла показывает, отличается ли скачанная копия от того, что на экране. */
function fileDirty(){return (S.updatedAt||'')!==(S.fileSavedAt||'');}
function paintSave(){
  var b=document.getElementById('bSave');
  if(!b)return;
  var d=fileDirty();
  b.classList.toggle('dirty',d);

  b.title=d?'Есть правки, которых нет в скачанном файле'
          :'Скачанный файл совпадает с тем, что на экране';
}

/* ─────────── формат и расчёты ─────────── */
var NB='\u00A0';
function num(n,d){var v=Math.round((+n||0)*Math.pow(10,d||0))/Math.pow(10,d||0);
  return v.toLocaleString('ru-RU',{maximumFractionDigits:d||0});}
function rub(n){return num(n,0)+NB+'\u20BD';}
function ru(n){return num(n,(Math.abs((+n||0)%1)>1e-9)?1:0);}
function L(){return S.log;}
function heads(){return Math.max(1,S.people.length);}
function calc(){
  var l=L(), km=(l.dist*l.kBack+l.local);
  var honda=km*l.consHonda/100*l.p95, aveo=km*l.consAveo/100*l.p95;
  var motoL=l.motoH*l.motoL, moto=motoL*l.p92, saw=l.sawL*l.p92;
  var boat=l.boatDays*l.boatDay, park=l.parkDays*l.parkDay*l.cars;
  var total=honda+aveo+moto+saw+boat+park;
  var l92=motoL+l.sawL, l95=km*l.consHonda/100+km*l.consAveo/100;
  return {km:km,honda:honda,aveo:aveo,moto:moto,motoL:motoL,saw:saw,boat:boat,park:park,
    total:total,l92:l92,l95:l95,cans:Math.ceil(l92/20)};
}
function isPersonal(sec){var s=S.buySections.filter(function(x){return x.id===sec;})[0];return !!(s&&s.personal);}
function buyPrice(p){return (+p.prf>0)?(+p.prf):((+p.pr)||0);}
function buySum(p){return p.st==='buy'?(+p.q||0)*buyPrice(p):0;}
function buyPlanSum(p){return p.st==='buy'?(+p.q||0)*((+p.pr)||0):0;}
function buyPlanShared(){var s=0;S.buy.forEach(function(p){if(!isPersonal(p.sec))s+=buyPlanSum(p);});return s;}
function buySecSum(sec){var t=0;S.buy.forEach(function(p){if(p.sec===sec)t+=buySum(p);});return t;}
function buyShared(){var t=0;S.buy.forEach(function(p){if(!isPersonal(p.sec))t+=buySum(p);});return t;}
function buyPersonal(){var t=0;S.buy.forEach(function(p){if(isPersonal(p.sec))t+=buySum(p);});return t;}
function grand(){var c=calc(),b=buyShared();
  return {trans:c.total,buy:b,all:c.total+b,per:(c.total+b)/heads(),pers:buyPersonal()};}
function pairs(g){var k=Object.keys(g.o||{}).filter(function(p){return (g.o[p]||0)>0;});return k.length?k:['base'];}
function gearProg(who){var d=0,a=0;
  S.gear.forEach(function(g){pairs(g).forEach(function(p){
    if(who&&p!==who)return; a++; if((g.s[p]||0)>=ST_OK)d++;});});
  return {done:d,all:a};}
function secProg(sec,who){var d=0,a=0;
  S.gear.forEach(function(g){if(g.sec!==sec)return;pairs(g).forEach(function(p){
    if(who&&p!==who)return;a++;if((g.s[p]||0)>=ST_OK)d++;});});
  return {done:d,all:a};}
function buyProg(sec){var d=0,a=0;S.buy.forEach(function(p){if(sec&&p.sec!==sec)return;
  if(p.st==='skip'||p.st==='ask')return;a++;if(p.b)d++;});return {done:d,all:a};}
function readiness(){var g=gearProg(null),b=buyProg(null);
  var a=g.all+b.all,d=g.done+b.done;return a?Math.round(d/a*100):0;}
function person(id){for(var i=0;i<S.people.length;i++)if(S.people[i].id===id)return S.people[i];
  return {id:'base',name:'не распределено',ini:'—',color:'#6E7076',photo:''};}
function daysLeft(){return Math.ceil((new Date(S.trip.start)-new Date())/86400000);}
function edIn(node,set,ph){
  node.contentEditable='true';node.spellcheck=false;
  if(ph)node.dataset.ph=ph;
  node.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();node.blur();}};
  node.onblur=function(){set((node.textContent||'').trim());touch();};
  node.onclick=function(e){e.stopPropagation();};
  return node;
}
var heroTarget=null;
function edText(get,set,cls,ph){
  var e=el('div',cls||'edN');
  e.textContent=get()||'';
  e.contentEditable='true'; e.spellcheck=false;
  e.dataset.ph=ph||'добавить описание';
  e.onkeydown=function(ev){if(ev.key==='Enter'){ev.preventDefault();e.blur();}};
  e.onblur=function(){set((e.textContent||'').trim());touch();};
  e.onclick=function(ev){ev.stopPropagation();};

   Раньше поле просто фильтровало списки — было непонятно, что и где нашлось.
   Теперь под полем список находок с указанием раздела, тап прокручивает к строке,
   раскрыв её группу, и подсвечивает найденное. */
function searchIndex(){
  var out=[];
  function sec(list,id){var t='';list.forEach(function(x){if(x.id===id)t=x.t;});return t;}
  S.gear.forEach(function(g){out.push({kind:'gear',i:g.i,n:g.n,c:g.c||'',tab:'gear',
    where:'Сборы · '+sec(S.gearSections,g.sec),item:g});});
  S.buy.forEach(function(p){out.push({kind:'buy',i:p.i,n:p.n,c:p.c||'',tab:'buy',
    where:'Закупка · '+sec(S.buySections,p.sec),item:p});});
  S.route.forEach(function(r){out.push({kind:'route',i:r.i,n:r.n,c:r.c||'',tab:'log',
    where:'Логистика · маршрут и тайминг',item:r});});
  S.ideas.forEach(function(q){out.push({kind:'ideas',i:q.i,n:q.n,c:q.why||'',tab:'log',
    where:'Логистика · что уточнить',item:q});});
  S.menu.forEach(function(d){(d.dishes||[]).forEach(function(x){
    out.push({kind:'menu',i:d.i,n:x.n,c:x.q||'',tab:'menu',where:'Меню · '+d.t,item:d});});});
  return out;
}
function searchFind(q){
  q=String(q||'').trim().toLowerCase();
  if(q.length<2)return [];
  var head=[], tail=[];
  searchIndex().forEach(function(h){
    var n=(h.n||'').toLowerCase(), c=(h.c||'').toLowerCase();
    var pn=n.indexOf(q);
    if(pn===0)head.push(h);
    else if(pn>0)tail.push(h);
    else if(c.indexOf(q)>=0)tail.push(h);
  });
  return head.concat(tail).slice(0,14);
}
function markUp(text,q){
  var s=String(text||''), p=s.toLowerCase().indexOf(String(q).toLowerCase());
  if(p<0||!q)return esc(s);
  return esc(s.slice(0,p))+'<mark>'+esc(s.slice(p,p+q.length))+'</mark>'+esc(s.slice(p+q.length));
}

  if(!box)return;

  if(q.length<2){box.style.display='none';return;}
  box.style.display='';
  var hits=searchFind(q);
  if(!hits.length){
    box.appendChild(el('div','sgEmpty','Ничего не нашлось. Поищи по части слова — например «чайн» или «бензин».'));
    return;
  }
  hits.forEach(function(h){
    var b=el('button','sgI','<b>'+markUp(h.n,q)+'</b><u>'+esc(h.where)+(h.c?(' · '+esc(h.c)):'')+'</u>');

function jumpTo(h){
  closeSearch();
  var tab=h.tab, key=null, note='';
  if(h.kind==='gear'){
    /* вещь может быть не в личном списке — тогда показываем общую базу.
       Выбранное «я» при этом не трогаем: права остаются прежними */
    if(gearWho()&&!((h.item.o||{})[gearWho()]>0)){
      gearFilter=null;
      note='«'+h.n+'» в твоём списке нет — показал общую базу.';
    }
    key='g_'+h.item.sec+(gearWho()||'');
  }
  else if(h.kind==='buy')key='b_'+h.item.sec;
  else if(h.kind==='menu')key='m_'+h.item.i;
  if(key){S.ui.open[key]=true;persist();}
  renderSec(tab);
  S.ui.tab=tab;syncNav();
  /* именно setTimeout, а не кадр отрисовки: в свёрнутой вкладке кадры не приходят */
  setTimeout(function(){
    var node=document.querySelector('#s-'+tab+' [data-hit="'+h.i+'"]');
    if(!node){go(tab);return;}
    var top=Math.max(0,node.getBoundingClientRect().top+window.scrollY-96);
    try{window.scrollTo({top:top,behavior:'smooth'});}catch(e){window.scrollTo(0,top);}
    /* если плавная прокрутка не сработала (свёрнутая вкладка, отключённая анимация) — доводим сразу */
    setTimeout(function(){if(Math.abs(window.scrollY-top)>40)window.scrollTo(0,top);},420);
    node.classList.remove('hit');void node.offsetWidth;node.classList.add('hit');
    setTimeout(function(){node.classList.remove('hit');},2400);
    if(note)toast(note,null,null,5000);
  },0);
}

  var n=Math.round(+t||0);
  return (n>0?'+':(n<0?'−':''))+Math.abs(n)+'°';

  var img=new Image();
  img.onerror=function(){toast('Это не похоже на картинку.');};
  img.onload=function(){
    var BW=Math.max(200,Math.min(300,(window.innerWidth||360)-84)), BH=Math.round(BW/ratio);
    var base=Math.max(BW/img.width,BH/img.height), zoom=1, ox=0, oy=0;
    sheet(function(c,close){
      c.appendChild(el('h3',null,opts.title||'Кадр'));
      c.appendChild(el('p',null,opts.hint||'Подвинь снимок пальцем или мышью, ползунок — масштаб.'));
      var wrap=el('div','cropWrap'), box=el('div','cropBox');
      box.style.width=BW+'px';box.style.height=BH+'px';
      var im=el('img'); im.src=dataUrl; box.appendChild(im); wrap.appendChild(box);
      var zr=el('input','zoom'); zr.type='range'; zr.min='1'; zr.max='3'; zr.step='0.01'; zr.value='1';
      zr.setAttribute('aria-label','Масштаб');
      wrap.appendChild(zr);
      wrap.appendChild(el('div','cropHint',opts.frameHint||'В рамке — то, что увидят остальные.'));
      c.appendChild(wrap);
      function draw(){
        var dw=img.width*base*zoom, dh=img.height*base*zoom;
        var maxX=Math.max(0,(dw-BW)/2), maxY=Math.max(0,(dh-BH)/2);
        ox=Math.max(-maxX,Math.min(maxX,ox)); oy=Math.max(-maxY,Math.min(maxY,oy));
        im.style.width=dw+'px'; im.style.height=dh+'px';
        im.style.left=(BW/2-dw/2+ox)+'px'; im.style.top=(BH/2-dh/2+oy)+'px';
      }
      draw();
      zr.oninput=function(){zoom=parseFloat(zr.value)||1;draw();};
      var drag=null;
      function down(e){drag={x:(e.touches?e.touches[0].clientX:e.clientX),y:(e.touches?e.touches[0].clientY:e.clientY),ox:ox,oy:oy};}
      function move(e){if(!drag)return;
        var x=(e.touches?e.touches[0].clientX:e.clientX),y=(e.touches?e.touches[0].clientY:e.clientY);
        ox=drag.ox+(x-drag.x);oy=drag.oy+(y-drag.y);draw();
        if(e.cancelable)e.preventDefault();}
      function up(){drag=null;}
      box.addEventListener('mousedown',down);window.addEventListener('mousemove',move);window.addEventListener('mouseup',up);
      box.addEventListener('touchstart',down,{passive:true});
      box.addEventListener('touchmove',move,{passive:false});
      box.addEventListener('touchend',up,{passive:true});
      var r=el('div','btnRow');
      var no=el('button',null,'Отмена'), yes=el('button','pri',opts.ok||'Поставить');
      r.appendChild(no);r.appendChild(yes);c.appendChild(r);
      function cleanup(){window.removeEventListener('mousemove',move);window.removeEventListener('mouseup',up);}
      no.onclick=function(){cleanup();close();};
      yes.onclick=function(){
        var OW=out, OH=Math.round(out/ratio), k=OW/BW;
        var cv=document.createElement('canvas');cv.width=OW;cv.height=OH;
        var ctx=cv.getContext('2d');
        var dw=img.width*base*zoom, dh=img.height*base*zoom;
        ctx.drawImage(img,(BW/2-dw/2+ox)*k,(BH/2-dh/2+oy)*k,dw*k,dh*k);
        cleanup();close();
        done(cv.toDataURL('image/jpeg',q));
      };
    });
  };
  img.src=dataUrl;
}

var ST_ICON=['circle','clock','packed','incar'];

/* «не могу взять» отмечается и без причины — признаком служит сам ключ, а не его текст */

}

function swipeDel(row,inn,onDel){
  var x0=null,dx=0;
  row.addEventListener('touchstart',function(e){
    if(e.touches.length!==1)return;x0=e.touches[0].clientX;dx=0;row.classList.add('sw');},{passive:true});
  row.addEventListener('touchmove',function(e){
    if(x0==null)return;dx=e.touches[0].clientX-x0;
    if(dx>0)dx=0;if(dx<-124)dx=-124;
    inn.style.transform='translateX('+dx+'px)';},{passive:true});
  row.addEventListener('touchend',function(){
    row.classList.remove('sw');

var MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
function saveFile(){
  var btn=$('#bSave');btn.classList.add('busy');
  try{
    S.author=S.ui.me?person(S.ui.me).name:'';
    S.updatedAt=new Date().toISOString();
    S.fileSavedAt=S.updatedAt;          /* в самом файле правок «не сохранено» уже нет */
    var c=document.documentElement.cloneNode(true);
    var a1=c.querySelector('#app');if(a1)a1.innerHTML='<div class="boot">Загружаю сборный лист…</div>';
    ['#fileIn','#photoIn','#heroIn'].forEach(function(sel){var x=c.querySelector(sel);if(x)x.remove();});
    /* выкидываем всё, что добавила среда предпросмотра: чужие скрипты, стили и атрибуты */
    var MINE={'app-code':1,'seed':1,'sync-code':1};
    Array.prototype.slice.call(c.querySelectorAll('script')).forEach(function(s){
      if(!MINE[s.id])s.remove();
    });
    Array.prototype.slice.call(c.querySelectorAll('style')).forEach(function(s){
      if(s.id!=='app-css'&&s.id!=='app-css-hero')s.remove();
    });
    Array.prototype.slice.call(c.querySelectorAll('link')).forEach(function(l){
      var r=(l.getAttribute('rel')||'').toLowerCase();
      if(r==='stylesheet'||r==='modulepreload'||r==='preload')l.remove();
    });
    Array.prototype.slice.call(c.querySelectorAll('[data-om-id],[data-cc-id],[data-dm-ref],[data-src-ver]')).forEach(function(n){
      n.removeAttribute('data-om-id');n.removeAttribute('data-cc-id');
      n.removeAttribute('data-dm-ref');n.removeAttribute('data-src-ver');
    });
    ['data-om-id','data-src-ver','style','class'].forEach(function(a){c.removeAttribute(a);});
    var hd=c.querySelector('head');
    if(hd&&!hd.querySelector('meta[charset]')){
      var mc=document.createElement('meta');mc.setAttribute('charset','utf-8');hd.insertBefore(mc,hd.firstChild);
    }
    SAVE_STRIP.forEach(function(sel){
      Array.prototype.slice.call(c.querySelectorAll(sel)).forEach(function(x){x.remove();});
    });
    var cb=c.querySelector('body');   /* запас под панель мессенджера — дело браузера, не файла */
    if(cb)cb.classList.remove('inapp');
    var sd=c.querySelector('#seed');if(sd)sd.textContent=JSON.stringify(S);
    c.setAttribute('lang','ru');
    c.setAttribute('data-theme',document.documentElement.getAttribute('data-theme')||'light');
    var html='<!DOCTYPE html>\n'+c.outerHTML;
    var url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    var now=new Date();
    var name='Вуокса-2026'+(S.author?'_'+S.author:'')+'_'+('0'+now.getDate()).slice(-2)+'-'+MON[now.getMonth()]+'.html';
    var a=document.createElement('a');a.href=url;a.download=name;
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(url);a.remove();},1500);
    persist();paintSave();
    toast('Файл сохранён. Кинь его обратно в чат.');
  }catch(e){toast('Не получилось сохранить файл: '+(e&&e.message?e.message:'неизвестная ошибка'));}
  setTimeout(function(){btn.classList.remove('busy');},600);
}

$('#fileIn').onchange=function(){
  var f=this.files&&this.files[0];this.value='';
  if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var m=String(fr.result).match(/<script id="seed"[^>]*>([\s\S]*?)<\/script>/i);
      if(!m)throw new Error('в файле нет данных планировщика');
      var inc=JSON.parse(m[1]);
      if(!inc||!inc.gear)throw new Error('данные не читаются');
      mergeFile(normalize(inc));
    }catch(e){toast('Файл не подошёл: '+(e&&e.message?e.message:'не читается'));}
  };
  fr.onerror=function(){toast('Файл не прочитался. Попробуй ещё раз.');};
  fr.readAsText(f);
};

        c2.appendChild(el('p',null,'Отменить это будет нельзя. Если сомневаешься — сначала сохрани файл.'));
        var r2=el('div','btnRow');
        var n2=el('button',null,'Отмена'),y2=el('button','dang','Сбросить');
        r2.appendChild(n2);r2.appendChild(y2);c2.appendChild(r2);
        n2.onclick=close2;
        y2.onclick=function(){
          S.gear.forEach(function(g){g.s={};});S.buy.forEach(function(p){p.b=false;});
          S.route.forEach(function(x){x.done=false;});S.menu.forEach(function(d){d.done=false;});
          S.ideas.forEach(function(q){q.done=false;});
          touch();close2();render();toast('Все отметки сброшены.');
        };
      });
    };
  });
}
function exportText(){
  var G=grand(),g=gearProg(null),b=buyProg(null),lines=[];
  lines.push('ВУОКСА · 2026 — '+S.trip.dates+' · '+S.trip.place);
  var d=daysLeft();lines.push(d>0?('До выезда '+d+' '+plural(d,'день','дня','дней')):'Выезд уже');
  lines.push('Готовность: '+readiness()+'% · снаряжение '+g.done+'/'+g.all+' · закупка '+b.done+'/'+b.all);
  lines.push('');
  lines.push('ДЕНЬГИ');
  lines.push('Транспорт, лодка, парковка: '+rub(G.trans));
  lines.push('Продукты и расходники: '+rub(G.buy));
  lines.push('Общий бюджет: '+rub(G.all)+' · с каждого '+rub(G.per));
  if(G.pers)lines.push('Алкоголь (личное, не делится): '+rub(G.pers));
  lines.push('');
  S.people.forEach(function(p){
    var left=S.gear.filter(function(x){return (x.o[p.id]>0)&&((x.s[p.id]||0)<2);});
    lines.push(p.name.toUpperCase()+' — не упаковано: '+left.length);
    left.slice(0,40).forEach(function(x){lines.push('  · '+x.n+(x.o[p.id]>1?(' ×'+ru(x.o[p.id])):''));});
    if(left.length>40)lines.push('  … и ещё '+(left.length-40));
    lines.push('');
  });
  var toBuy=S.buy.filter(function(p){return p.st==='buy'&&!p.b&&!isPersonal(p.sec);});
  lines.push('КУПИТЬ ('+toBuy.length+')');
  toBuy.forEach(function(p){lines.push('  · '+p.n+' — '+ru(p.q)+' '+p.u+' · '+rub(buySum(p))
    +(p.who?(' · '+person(p.who).name):''));});
  lines.push('');lines.push(S.trip.note);
  var txt=lines.join('\n');
  sheet(function(c,close){
    c.appendChild(el('h3',null,'Текст для Телеграма'));
    c.appendChild(el('p',null,'Скопируй и вставь в чат.'));
    var ta=el('textarea');ta.value=txt;c.appendChild(ta);
    var r=el('div','btnRow');
    var cp=el('button','pri','Скопировать'),cl2=el('button',null,'Закрыть');
    r.appendChild(cl2);r.appendChild(cp);c.appendChild(r);
    cl2.onclick=close;
    cp.onclick=function(){
      ta.focus();ta.select();var ok=false;
      try{ok=document.execCommand('copy');}catch(e){}
      if(!ok&&navigator.clipboard)navigator.clipboard.writeText(txt).then(function(){toast('Текст скопирован.');},function(){toast('Скопируй вручную — текст выделен.');});
      else toast(ok?'Текст скопирован.':'Скопируй вручную — текст выделен.');
      if(ok)close();
    };
  });
}

/* ── расчёт с редактируемыми подписями (перекрывает раннюю версию) ── */
function paintCalc(){
  var c=calc(), l=L(), card=$('#calcCard'); if(!card)return;
  var vals={honda:c.honda,aveo:c.aveo,moto:c.moto,saw:c.saw,boat:c.boat,park:c.park};
  var subs={
    honda:ru(c.km)+' км · '+ru(c.km*l.consHonda/100)+' л АИ-95',
    aveo:ru(c.km)+' км · '+ru(c.km*l.consAveo/100)+' л АИ-95',
    moto:ru(l.motoH)+' ч · '+ru(c.motoL)+' л АИ-92',
    saw:ru(l.sawL)+' л АИ-92 (смесь)',
    boat:ru(l.boatDays)+' сут. × '+rub(l.boatDay),
    park:ru(l.parkDays)+' сут. × '+rub(l.parkDay)+' × '+ru(l.cars)
  };
  card.innerHTML='';
  (S.calcRows||[]).forEach(function(cr){
    var r=el('div','cRow'), d=el('div');
    d.appendChild(edText(function(){return cr.t;},function(x){if(x)cr.t=x;},'edT','название строки'));
    d.appendChild(el('div','edN',esc(subs[cr.k]||'')));
    $('.edN',d).contentEditable='false';
    r.appendChild(d);
    r.appendChild(el('span','money',rub(vals[cr.k]||0)));
    card.appendChild(r);
  });
  var G=grand();
  card.appendChild(el('div','totRow','<em>Транспорт, лодка, парковка</em><b>'+rub(c.total)+'</b>'));
  card.appendChild(el('div','cRow','<div><em>Плюс продукты и расходники</em>'
    +'<small>Раздел «Закупка», статус «Купить». Фактические цены — вместо плановых.</small></div>'
    +'<span class="money">'+rub(G.buy)+'</span>'));
  card.appendChild(el('div','totRow','<em>Общий бюджет на всех</em><b>'+rub(G.all)+'</b>'));
  var pr=el('div','totRow');pr.style.background='transparent';
  pr.innerHTML='<em>С каждого · ÷'+heads()+'</em><b>'+rub(G.per)+'</b>';
  card.appendChild(pr);
  if(G.pers)card.appendChild(el('div','subTot pers',
    '<span>Алкоголь и сигареты — личное, в делёж не входит</span><b>'+rub(G.pers)+'</b>'));
  var can=$('#canCard');
  if(can){
    var have=0;S.gear.forEach(function(g){if(/канистра/i.test(g.n))Object.keys(g.o).forEach(function(k){have+=g.o[k]||0;});});
    var cv={l92:ru(c.l92)+'\u2009л · '+c.cans+'\u2009шт.',l95:ru(c.l95)+'\u2009л'};
    can.innerHTML='';
    (S.canRows||[]).forEach(function(cr){
      var r=el('div','cRow'), d=el('div');
      d.appendChild(edText(function(){return cr.t;},function(x){if(x)cr.t=x;},'edT','название строки'));
      d.appendChild(edText(function(){return cr.c;},function(x){cr.c=x;},'edN','пояснение'));
      r.appendChild(d);r.appendChild(el('span','money',cv[cr.k]||''));
      can.appendChild(r);
    });
    can.appendChild(el('div','cRow','<div><em>В снаряжении сейчас канистр</em>'
      +'<small>Считается по строкам со словом «канистра» в разделе «Сборы».</small></div>'
      +'<span class="money">'+ru(have)+'\u2009шт.</span>'));
    if(c.cans>have)can.appendChild(el('div','warnBox',svg('warn')+'<span>Канистр не хватает: нужно '
      +c.cans+', в списке снаряжения '+ru(have)+'. Докупить до отъезда.</span>'));
  }
}
/* ── меню: дни можно добавлять и убирать (перекрывает раннюю версию) ── */
var viewMenuBase=viewMenu;
viewMenu=function(v){
  viewMenuBase(v);
  var add=el('button','addRow',svg('plus')+'<span>Добавить день</span>');
  add.style.cssText+=';background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border-top:0';
  add.onclick=function(){
    var d={i:'d_'+Date.now().toString(36),t:'Новый день',sub:'',done:false,dishes:[{n:'Блюдо',q:''}]};
    S.menu.push(d);touch();render();go('menu');
  };
  v.appendChild(add);
};
function boot(){
  applyTheme();
  if(inAppBrowser())document.body.classList.add('inapp');
  render();
  paintSave();
  if(!lsOk)renderWarn();
  if(S.seedAdded){toast('В файле появились новые позиции: '+S.seedAdded+'. Твои отметки на месте.');S.seedAdded=0;persist();}
  /* после первого показа гасим анимацию въезда разделов — см. body.settled в стилях */
  setTimeout(function(){document.body.classList.add('settled');},600);
}
try{boot();}catch(err){
  var box=document.getElementById('app');
  if(box)box.innerHTML='<div class="crash"><b>Файл не смог открыться</b>'
   +'Сообщи эту строку тому, кто собирал файл: '+esc(String(err&&err.message?err.message:err))
   +'<br><br>Скорее всего поможет открыть файл в другом браузере или взять предыдущую версию из чата.</div>';
}
try{window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){if(!S.theme)applyTheme();});}catch(e){}
</script>
